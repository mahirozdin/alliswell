<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1600, height=1000" />
    <title>Tour: files</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="../assets/cam.js"></script>
    <link rel="stylesheet" href="../assets/loop.css" />
    <!-- Files next to the work (ADR-0061): the Files folders on the web, and
         the same files on the phone. Seamless. -->
    <style>
      html, body { width: 1600px; height: 1000px; }
      .cam > img { width: 1600px; height: 1000px; }
      #phone { left: 1060px; top: 60px; width: 404px; height: 880px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="loop-tour-files" data-start="0" data-width="1600" data-height="1000" data-duration="9">
      <div class="plate" id="a"><div class="cam" id="camA"><img src="../assets/shots/web-files.png" alt="" /></div></div>
      <div class="phone" id="phone"><img src="../assets/shots/ios-05-files.png" alt="" /></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo('#camA', focusOn(1.45, 560, 330), { ...focusOn(1.3, 600, 380), duration: 4.5, ease: 'power1.inOut' }, 0);
      tl.to('#camA', { ...focusOn(1.45, 560, 330), duration: 4.0, ease: 'power1.inOut' }, 4.8);
      tl.fromTo('#phone', { x: 300, opacity: 0 }, { x: 0, opacity: 1, duration: 0.8, ease: 'power3.out' }, 1.8);
      tl.to('#phone', { x: 300, opacity: 0, duration: 0.7, ease: 'power3.in' }, 6.9);
      window.__timelines['loop-tour-files'] = tl;
    </script>
  </body>
</html>
