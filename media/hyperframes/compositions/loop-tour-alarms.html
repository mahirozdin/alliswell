<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1600, height=1000" />
    <title>Tour: alarms</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="../assets/loop.css" />
    <!-- Alarms, not chimes (ADR-0061): the full-screen urgent reminder on
         Android, ringing on Silent, and the snooze preset that names the time
         it rings again. No words of its own: the screen carries them. -->
    <style>
      html, body { width: 1600px; height: 1000px; }
      #phone { left: 598px; top: 50px; width: 404px; height: 900px; }
      .rings { left: 800px; top: 315px; }
      #silent { left: 470px; top: 96px; }
      .hl { position: absolute; left: 804px; top: 569px; width: 132px; height: 44px; border-radius: 999px; box-shadow: 0 0 0 3px var(--periwinkle); opacity: 0; }
      .press { left: 870px; top: 591px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="loop-tour-alarms" data-start="0" data-width="1600" data-height="1000" data-duration="10">
      <div class="rings"><div class="ring" id="r1"></div><div class="ring" id="r2"></div><div class="ring" id="r3"></div></div>
      <div class="phone" id="phone"><img src="../assets/shots/android-09-alarm-ring.png" alt="" /></div>
      <div class="chip" id="silent"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.268 21a2 2 0 0 0 3.464 0" /><path d="M17 17H4a1 1 0 0 1-.74-1.673C4.59 13.956 6 12.499 6 8a6 6 0 0 1 .258-1.742" /><path d="m2 2 20 20" /><path d="M8.668 3.01A6 6 0 0 1 18 8c0 2.687.77 4.653 1.707 6.05" /></svg></div>
      <div class="hl" id="hl"></div>
      <div class="press"><span id="press"></span></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const cycle = 2.0;
      ['#r1', '#r2', '#r3'].forEach((id, i) => {
        tl.fromTo(id, { scale: 0.6, opacity: 0.85 }, { scale: 3.6, opacity: 0, duration: cycle, ease: 'power1.out', repeat: Math.max(0, Math.floor(10 / cycle) - 1) }, i * (cycle / 3));
      });
      tl.fromTo('#phone', { scale: 1 }, { scale: 1.015, duration: 0.25, ease: 'sine.inOut', yoyo: true, repeat: 15 }, 0.5);
      tl.fromTo('#silent', { scale: 0.92 }, { scale: 1, duration: 0.6, ease: 'sine.inOut', yoyo: true, repeat: 7 }, 0);
      tl.fromTo('#press', { scale: 0, opacity: 0.8 }, { scale: 1.3, opacity: 0, duration: 0.6, ease: 'power2.out' }, 5.6);
      tl.fromTo('#hl', { opacity: 0 }, { opacity: 1, duration: 0.3, ease: 'power1.out' }, 5.7);
      tl.to('#hl', { opacity: 0, duration: 0.6, ease: 'power1.inOut' }, 8.6);
      window.__timelines['loop-tour-alarms'] = tl;
    </script>
  </body>
</html>
