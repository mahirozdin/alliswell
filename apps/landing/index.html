    <!--
      EE-164 — the language. A browser that prefers Turkish is sent to the
      Turkish twin before anything paints, unless the reader has chosen a
      language with the switch (`aw_lang`, written by LangSwitch.vue). Only the
      ENGLISH pages carry this: the Turkish ones never redirect back, so a
      crawler — which prefers en-US and remembers nothing — indexes both, and
      a person who followed a Turkish link gets the Turkish page they asked for.
      Search and hash travel along, because every anchor id is the same in both
      languages.
    -->
    <script>
      try {
        var pref = localStorage.getItem('aw_lang');
        var langs = navigator.languages || [navigator.language || ''];
        var wantsTr = false;
        for (var i = 0; i < langs.length; i++) {
          if (/^tr\b/i.test(langs[i])) wantsTr = true;
        }
        if (pref !== 'en' && (pref === 'tr' || wantsTr)) {
          location.replace('/tr' + location.search + location.hash);
        }
      } catch (e) {
        /* no storage and no language list: stay on the page that was asked for */
      }
    </script>

    <!--
      EE-143 — the theme is applied by useTheme() in onMounted, which is one
      paint too late: a visitor who chose dark, or whose system is dark, sees a
      white flash on every navigation. This runs before the stylesheet, sets the
      same attribute useTheme() will set, and is wrapped because localStorage
      throws outright in some privacy modes — where the media query is still the
      right answer.
    -->
    <script>
      try {
        var t = localStorage.getItem('aw_theme');
        document.documentElement.dataset.theme =
          t === 'light' || t === 'dark'
            ? t
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
      } catch (e) {
        /* no stored preference is readable; useTheme() decides on mount */
      }
    </script>

    <!--
      A real JavaScript-off rendering, not a placeholder: Vue's mount() clears
      this container before its first render, so a reader who never runs the
      script still gets the heading, the claim and the pages that need no
      script at all. It is also what the CI <h1> assertion reads (EE-164; it
      used to be a <noscript> block, which a crawler does not count as content).
    -->
    <div id="app">
      <h1>Your whole day, in an app you actually own.</h1>
