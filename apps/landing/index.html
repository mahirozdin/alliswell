    <!--
      EE-164 — the language. A browser that prefers Turkish is sent to the
      Turkish twin before anything paints, unless the reader has chosen a
      language with the switch (`aw_lang`, written by LangSwitch.vue). Only the
      ENGLISH pages carry this: the Turkish ones never redirect back, so a
      crawler — which prefers en-US and remembers nothing — indexes both, and
      a person who followed a Turkish link gets the Turkish page they asked for.
      Search and hash travel along, because every anchor id is the same in both
      languages.
    -->
    <script>
      try {
        var pref = localStorage.getItem('aw_lang');
        var langs = navigator.languages || [navigator.language || ''];
        var wantsTr = false;
        for (var i = 0; i < langs.length; i++) {
          if (/^tr\b/i.test(langs[i])) wantsTr = true;
        }
        if (pref !== 'en' && (pref === 'tr' || wantsTr)) {
          location.replace('/tr' + location.search + location.hash);
        }
      } catch (e) {
        /* no storage and no language list: stay on the page that was asked for */
      }
    </script>

    <!--
      ADR-0061 — the page is rendered on the server (scripts/prerender.mjs), so
      it reads complete with scripting off. This marks the document as
      scripted BEFORE the stylesheet paints, which is the only thing the CSS
      keys its JavaScript-only states on (tabs collapsing, pause buttons), so
      the server's markup and the first client paint agree and nothing shifts.
      It also remembers a language chosen with the switch (`aw_lang`, EE-164)
      the moment it is clicked, before Vue has hydrated anything.
    -->
    <script>
      document.documentElement.classList.add('js');
      document.addEventListener('click', function (e) {
        var a = e.target && e.target.closest ? e.target.closest('a[data-aw-lang]') : null;
        if (!a) return;
        try {
          localStorage.setItem('aw_lang', a.getAttribute('data-aw-lang'));
        } catch (err) {
          /* no storage: the choice lasts for this visit only */
        }
      });
    </script>
