    <!--
      No language redirect here, on purpose: only the English twin redirects
      (EE-164). A Turkish page that bounced an English browser back would make
      /tr a redirect for every crawler on earth.
    -->

    <!--
      ADR-0061 — the page is rendered on the server (scripts/prerender.mjs), so
      it reads complete with scripting off. This marks the document as
      scripted BEFORE the stylesheet paints, which is the only thing the CSS
      keys its JavaScript-only states on (tabs collapsing, pause buttons), so
      the server's markup and the first client paint agree and nothing shifts.
      It also remembers a language chosen with the switch (`aw_lang`, EE-164)
      the moment it is clicked, before Vue has hydrated anything.
    -->
    <script>
      document.documentElement.classList.add('js');
      document.addEventListener('click', function (e) {
        var a = e.target && e.target.closest ? e.target.closest('a[data-aw-lang]') : null;
        if (!a) return;
        try {
          localStorage.setItem('aw_lang', a.getAttribute('data-aw-lang'));
        } catch (err) {
          /* no storage: the choice lasts for this visit only */
        }
      });
    </script>

    <title>AllisWell: kendi sunucunuzda çalışabilen görev, not ve alarm uygulaması</title>

      EE-164 — each page names every version including itself; `x-default` is

    -->

    <link rel="alternate" hreflang="tr" href="https://alliswell.space/tr" />
    <link rel="alternate" hreflang="x-default" href="https://alliswell.space/" />

    <meta property="og:image" content="https://alliswell.space/shots/og/home-dusk-tr.jpg" />
