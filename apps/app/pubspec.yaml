name: alliswell
description: "AllisWell — source-available, self-hosted productivity hub: tasks, projects, notes, calendar sync and reminders."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.3.1+22
environment:
  sdk: ^3.12.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  # Locale-aware date/number formatting (OPH-123). Pinned by flutter_localizations;
  # declared directly since we import `package:intl` (DateFormat, initializeDateFormatting).
  intl: ^0.20.2
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  dio: ^5.10.0
  flutter_secure_storage: ^10.3.1
  flutter_quill: ^11.4.0
  shared_preferences: ^2.5.5
  web: ^1.1.1
  drift: ^2.34.2
  path_provider: ^2.1.6
  path: ^1.9.1
  socket_io_client: ^3.1.6
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.1
  url_launcher: ^6.3.2
  # Home-screen widgets (Epic 12, ADR-0010): the Dart↔native bridge — writes a
  # JSON snapshot to a shared container (App Group / SharedPreferences) that the
  # native WidgetKit/Glance widgets render. Used only through the WidgetHost
  # seam (features/widgets/) so the snapshot core stays unit-testable.
  home_widget: ^0.9.0
  # Apple EventKit bridge (OPH-077). A package, not files in Runner:
  # Flutter's tooling wires the podspec for iOS AND macOS, so no pbxproj surgery.
  alliswell_eventkit:
    path: packages/alliswell_eventkit
  # 12.x (beta) is REQUIRED on AGP 9: 11.0.2 skips applying its own Kotlin
  # plugin when it detects AGP 9, expecting Flutter to compile its Kotlin —
  # which Flutter 3.44 does not, so the release build cannot find
  # FilePickerPlugin. Reproduced on a bare `flutter create` app (2026-07-26).
  file_picker: ^12.0.0-beta.7

  # ── Firebase (Epic 21, ADR-0025) — OPTIONAL at runtime ────────────────────
  # Every one of these degrades to a no-op when the platform config file is
  # absent: `firebaseBootstrap()` catches the initialisation failure and the
  # rest of the app never learns Firebase exists. A fork with no Firebase
  # project builds and runs unchanged; see docs/FIREBASE.md.
  firebase_core: ^4.2.0
  firebase_analytics: ^12.0.4
  firebase_crashlytics: ^5.0.4
  firebase_performance: ^0.11.0+4
  firebase_auth: ^6.2.0
  # The provider dance itself. These give us the ID TOKEN that our own API
  # verifies (ADR-0026) — Firebase Auth is an identity provider here, never the
  # user store: that stays MySQL, so a self-hoster keeps email+password working
  # with no Google account anywhere in the picture.
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1
  crypto: ^3.0.6
  # The in-app alarm bed (OPH-180, ADR-0015 §7). Chosen over just_audio because
  # ONE package covers every target we ship (incl. Windows/Linux, where
  # just_audio needs a community backend) and exposes the two platform knobs the
  # alarm actually needs: the iOS AVAudioSession category `.playback` (audible
  # with the mute switch ON while the app is in the FOREGROUND — not the
  # background-audio trick NOTIFICATIONS §2b rejects) and Android's
  # `USAGE_ALARM` audio attributes.
  audioplayers: ^6.8.1
  flutter_slidable: ^4.0.3
  # AI voice (OPH-223, ADR-0023): on-device STT, behind the SttController seam.
  speech_to_text: ^7.0.0
  # AI share target (OPH-225, ADR-0023): behind the ShareIntentSource seam.
  #
  # The old cap said "<1.8.0 because 1.8+ is Swift-Package-Manager only and we
  # build with CocoaPods". That was WRONG: SPM-only starts at 1.9.0.
  #
  # 1.8.1 is here for its screenshot support (1.8.0) and because it is
  # API-identical to 1.7.0 — NOT for its "Fixed sharing not working on iOS 18"
  # line, which was measured and does nothing for us: the fix looks for a
  # UIApplication in a responder chain, and an app extension's never has one.
  # ADR-0029 quotes the code and records why the extension now notifies instead
  # of trying to open the app.
  #
  # 1.9.0 stays out: SPM-only, Flutter 3.38, and its own SceneDelegate contract.
  receive_sharing_intent: ">=1.8.1 <1.9.0"
  # Attachment capture (OPH-244, ADR-0027). `file_picker` alone cannot satisfy
  # DESIGN §30 A2: its Android path builds ACTION_GET_CONTENT for image/video/
  # media (FileUtils.kt) rather than the Android Photo Picker, and it has no
  # camera at all. image_picker gives us PHPicker on iOS 15+ and PickVisualMedia
  # on Android 13+, and — measured across five versions in the pub cache — its
  # Android manifest declares ZERO permissions. The `camera` package was
  # rejected for exactly the opposite reason: camera_android_camerax declares
  # CAMERA, RECORD_AUDIO *and* WRITE_EXTERNAL_STORAGE.
  image_picker: ^1.2.0
  # Direct, not transitive: the Android Photo Picker is OFF by default
  # (`useAndroidPhotoPicker = false`) and we have to reach the implementation
  # class to turn it on — without that it silently falls back to the document
  # browser, i.e. the bug this round fixes.
  image_picker_android: ^0.8.13
  # Only for the `ImagePickerPlatform.instance` cast above; declared so the
  # analyzer's depend_on_referenced_packages stays happy.
  image_picker_platform_interface: ^2.11.0

  # Note → PDF export (round 16 #3). `pdf` builds the document in pure Dart, so
  # the layout engine is unit-testable with no platform channel; `printing`
  # supplies the one thing Dart cannot do — handing the bytes to the OS (share
  # sheet on mobile, save panel on desktop, download on web) — and covers all
  # six targets we ship.
  pdf: ^3.11.3
  printing: ^5.14.2

  # The markdown workspace (round 17, ADR-0028 — OPH-247).
  #
  # `markdown` was already in the tree TRANSITIVELY (via flutter_quill); it is
  # declared directly because we now import it from lib/, and importing a
  # transitive package trips `depend_on_referenced_packages`. It is the parser
  # only — the widget tree is ours, because no renderer package exposes the
  # node -> source-line map that D4/D5/D13/D14/D16 all depend on (measured in
  # OPH-246: `scripts/markdown/measure_coverage.dart`).
  markdown: ^7.3.1
  # Syntax highlighting for fenced code (DESIGN §29 D9) — the pure-Dart LEXER
  # only. Deliberately NOT `flutter_highlight`: all that package adds is a
  # widget plus ready-made theme maps, and D7 forbids a package's own colours.
  # Token classes are painted from AwTokens.
  highlight: ^0.7.0
  # Inline/block math (DESIGN §29 D6, ADR-0028 §3). Pure Flutter painting with
  # KaTeX fonts — no JS engine, no web view, which D10 requires on the reading
  # path.
  #
  # Measured against the alternative rather than assumed: adding
  # `flutter_markdown_plus_latex` resolves to 10 new packages and pulls
  # `flutter_math_fork` in ANYWAY, on top of `flutter_markdown_plus` — a whole
  # renderer ADR-0028 already declined. It is a bridge to a renderer we do not
  # use, so we take the engine directly: 8 new packages instead of 10.
  #
  # The cost is honest: it drags flutter_svg + vector_graphics + provider +
  # nested + tuple along. The APK/IPA delta is measured in OPH-247 and written
  # into TASKS.
  flutter_math_fork: ^0.7.4

  # Dropping a file onto the editor (DESIGN §29 D20's neighbour, OPH-250).
  # Flutter has no built-in OS-file drop, and the only alternative that covers
  # the desktops AND the web is dart:html, which is web-only — so this is a
  # package or nothing. Not a new dependency CATEGORY (file_picker and
  # image_picker are the same thing through a different door), so no ADR.
  #
  # 0.7.1 registers macOS, Windows, Linux, Android and web; there is no iOS
  # plugin class, and `DropTarget` degrades to a plain pass-through there
  # rather than throwing. `super_drag_and_drop` was rejected for the reason
  # its clipboard sibling was: super_native_extensions puts a Rust toolchain
  # into all six platform builds and into CI.
  desktop_drop: ^0.7.1
  # Only for the `XFile` a drop hands back; declared so the analyzer's
  # depend_on_referenced_packages stays happy (same reason as
  # image_picker_platform_interface above).
  cross_file: ^0.3.4+2

dev_dependencies:
  # Generates the iOS AppIcon set + Android mipmaps/adaptive icons from
  # assets/branding/ — run: dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # i18n locale files (Epic 11). Adding a language = drop `<code>.json` here and
  # register its Locale in lib/src/i18n/i18n.dart (ADR-0009).
  assets:
    - assets/i18n/
    # The 28 s alarm bed the in-app ring screen loops (OPH-180). The same sound
    # the OS notification carries, as a Flutter asset so every platform — incl.
    # desktop and web, where there is no OS alarm — can play it.
    - assets/audio/
    # PDF-exporter fonts ONLY — NOT a Flutter `fonts:` entry, so they never
    # change what the UI renders (DESIGN §3.3 keeps system fonts). Both are
    # correctness requirements, not styling:
    #   Roboto (Apache-2.0, from the Flutter SDK) — the `pdf` package's built-in
    #     Helvetica is WinAnsi-encoded and has no ı/ğ/ş/İ, so every Turkish note
    #     would export as mojibake;
    #   DejaVu Sans (Bitstream Vera licence, official upstream) — Roboto's cmap
    #     is 896 code points and carries none of → ← ✓ ✗ ★ ☐, which drew as
    #     hollow boxes until it was wired in as a per-glyph fallback.
    # Both LICENCE files ship beside them.
    - assets/fonts/

  # To add more assets to your application, add them to this section, like this:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# Launcher icons are GENERATED, not hand-placed: `dart run flutter_launcher_icons`
# rebuilds every density from these sources, so the app icon can never drift
# from the brand mark in docs/assets/.
#
# The adaptive-icon LAYERS are themselves generated, from the one master
# artwork: `python3 scripts/design/branding_icons.py` (round 16 #1 — the hand-made
# foreground was an opaque white square, so every Android 8+ launcher covered the
# background layer and drew a blank white tile). That script also asserts the
# invariants an adaptive foreground has to meet: transparent corners, mark inside
# the safe zone, centred.
flutter_launcher_icons:
  image_path: assets/branding/icon.png
  android: true
  # An image, not a flat colour: Android then shows the SAME artwork as iOS
  # (brand gradient) instead of a flat field behind the mark.
  adaptive_icon_background: assets/branding/icon-background.png
  adaptive_icon_foreground: assets/branding/icon-foreground.png
  # Android 13+ themed icons: the launcher tints this layer's alpha to the user's
  # wallpaper palette. Without it a themed home screen falls back to the full
  # icon shrunk inside a grey circle.
  adaptive_icon_monochrome: assets/branding/icon-monochrome.png
  # OFF on purpose, and REPLACED — not merely disabled. v0.14.4 rewrites EVERY
  # `ASSETCATALOG_COMPILER_*` build setting it finds to the icon name: it turned
  # the widget extension's GLOBAL_ACCENT_COLOR_NAME and
  # WIDGET_BACKGROUND_COLOR_NAME into `AppIcon`, and the boolean
  # GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS too. Reverting project.pbxproj after
  # every run would be a landmine, so `scripts/design/branding_icons.py` now
  # generates the iOS AppIcon set itself — from the same master, sized from the
  # catalog's own Contents.json, flattened to no alpha (App Store Connect
  # rejects a marketing icon that has one). It never touches the Xcode project.
  ios: false
  remove_alpha_ios: true
  web:
    generate: false
