name: alliswell
description: "AllisWell — open-source, self-hosted productivity hub: tasks, projects, notes, calendar sync and reminders."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 0.9.0+11
environment:
  sdk: ^3.12.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  # Locale-aware date/number formatting (OPH-123). Pinned by flutter_localizations;
  # declared directly since we import `package:intl` (DateFormat, initializeDateFormatting).
  intl: ^0.20.2
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  dio: ^5.10.0
  flutter_secure_storage: ^10.3.1
  flutter_quill: ^11.4.0
  shared_preferences: ^2.5.5
  web: ^1.1.1
  drift: ^2.34.2
  path_provider: ^2.1.6
  path: ^1.9.1
  socket_io_client: ^3.1.6
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.1
  url_launcher: ^6.3.2
  # Home-screen widgets (Epic 12, ADR-0010): the Dart↔native bridge — writes a
  # JSON snapshot to a shared container (App Group / SharedPreferences) that the
  # native WidgetKit/Glance widgets render. Used only through the WidgetHost
  # seam (features/widgets/) so the snapshot core stays unit-testable.
  home_widget: ^0.9.0
  # Apple EventKit bridge (OPH-077). A package, not files in Runner:
  # Flutter's tooling wires the podspec for iOS AND macOS, so no pbxproj surgery.
  alliswell_eventkit:
    path: packages/alliswell_eventkit
  # 12.x (beta) is REQUIRED on AGP 9: 11.0.2 skips applying its own Kotlin
  # plugin when it detects AGP 9, expecting Flutter to compile its Kotlin —
  # which Flutter 3.44 does not, so the release build cannot find
  # FilePickerPlugin. Reproduced on a bare `flutter create` app (2026-07-26).
  file_picker: ^12.0.0-beta.7
  # The in-app alarm bed (OPH-180, ADR-0015 §7). Chosen over just_audio because
  # ONE package covers every target we ship (incl. Windows/Linux, where
  # just_audio needs a community backend) and exposes the two platform knobs the
  # alarm actually needs: the iOS AVAudioSession category `.playback` (audible
  # with the mute switch ON while the app is in the FOREGROUND — not the
  # background-audio trick NOTIFICATIONS §2b rejects) and Android's
  # `USAGE_ALARM` audio attributes.
  audioplayers: ^6.8.1
  flutter_slidable: ^4.0.3
  # AI voice (OPH-223, ADR-0023): on-device STT, behind the SttController seam.
  speech_to_text: ^7.0.0
  # AI share target (OPH-225, ADR-0023): behind the ShareIntentSource seam.
  # Capped below 1.8 — that line is Swift-Package-Manager only, and this repo's
  # iOS build uses CocoaPods.
  receive_sharing_intent: ">=1.4.5 <1.8.0"

dev_dependencies:
  # Generates the iOS AppIcon set + Android mipmaps/adaptive icons from
  # assets/branding/ — run: dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # i18n locale files (Epic 11). Adding a language = drop `<code>.json` here and
  # register its Locale in lib/src/i18n/i18n.dart (ADR-0009).
  assets:
    - assets/i18n/
    # The 28 s alarm bed the in-app ring screen loops (OPH-180). The same sound
    # the OS notification carries, as a Flutter asset so every platform — incl.
    # desktop and web, where there is no OS alarm — can play it.
    - assets/audio/

  # To add more assets to your application, add them to this section, like this:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# Launcher icons are GENERATED, not hand-placed: `dart run flutter_launcher_icons`
# rebuilds every density from these two sources, so the app icon can never drift
# from the brand mark in docs/assets/.
flutter_launcher_icons:
  image_path: assets/branding/icon.png
  android: true
  adaptive_icon_background: "#4F63EF"
  adaptive_icon_foreground: assets/branding/icon-foreground.png
  ios: true
  remove_alpha_ios: true
  web:
    generate: false
