<!doctype html>
<!-- lang is updated at runtime to the active locale (OPH-128). -->
<html lang="en">
  <head>
    <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
    <base href="$FLUTTER_BASE_HREF" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <!--
    OPH-413 (R-08) — the opening screen below is plain HTML that paints long
    before the engine. Without a viewport tag a phone lays it out at 980 px
    and shrinks it (a 32 px icon, unreadable text), then re-flows when the
    engine adds its own tag. This is exactly the tag the engine writes
    (FullPageEmbeddingStrategy._applyViewportMeta), so the swap at boot
    changes nothing; `flt-viewport` marks it as the engine's, which keeps the
    debug console free of the "existing viewport tag" warning. Pinch zoom
    stays (WCAG 1.4.4). Guarded by test/web_shell_test.dart.
  -->
    <meta name="viewport" flt-viewport content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="description" content="Tasks, projects, notes and alarm-grade reminders — with two-way Google Calendar sync and an Apple Calendar mirror. Source-available and self-hostable." />

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="AllisWell" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <title>AllisWell</title>
    <link rel="manifest" href="manifest.json" />

    <!--
    Round 16 #2 — drag-selecting text in a note on FIREFOX drew the text twice:
    once by Flutter on the canvas and once, in 13 px monospace, on top of it.

    The culprit is `<textarea class="flt-text-editing">`, the hidden proxy the
    web engine keeps over the canvas for IME and the clipboard. It holds the
    real text and the engine hides it with `color: transparent`. But `color` is
    exactly what `::selection` overrides: the moment the engine mirrors the
    app's selection into that textarea, Firefox repaints the selected range in
    the SYSTEM selection colours and the invisible text becomes visible —
    misaligned, in the wrong font, over the real text. Chromium keeps the
    transparent colour for selected text, which is why this never showed there.

    Painting the selection is Flutter's job, on the canvas. The proxy must stay
    invisible in every state, so pin its selection colours to transparent.
    Separate rules on purpose: an unknown pseudo-element invalidates the whole
    selector, so `::-moz-selection` must not share a rule with `::selection`.
  -->
    <style>
      .flt-text-editing::selection {
        background-color: transparent;
        color: transparent;
      }
      .flt-text-editing::-moz-selection {
        background-color: transparent;
        color: transparent;
      }
    </style>

    <!--
    Runtime configuration (self-hosting): the published `alliswell-web` image
    rewrites this file from ALLISWELL_API_URL at container start, so one
    prebuilt bundle can serve any deployment. Loaded synchronously BEFORE
    flutter_bootstrap so the value is there on the first frame; when the file
    defines nothing, the compile-time --dart-define wins. See
    lib/src/core/runtime_config_web.dart.
  -->
    <script src="alliswell-config.js"></script>

    <!--
    OPH-413 (landing-audit K3) — the opening screen. Until the engine has
    downloaded (main.dart.js and CanvasKit are several megabytes) this page
    used to be white for seconds; a person who pressed "Start free" saw
    nothing and left. This is plain HTML and CSS, painted with the first
    bytes: the app's icon, its name, a progress bar, on the Glass wash
    (DESIGN tokens auroraTop/auroraBottom) in the light or dark variant the
    system asks for. The engine dispatches `flutter-first-frame` on window
    when it has painted, and the screen fades out and is removed then.
    No web font and no request anywhere else (ADR-0063 #7). Guarded by
    test/web_shell_test.dart and apps/api/test/unit/landing-enterprise.test.js.
  -->
    <style>
      #aw-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: linear-gradient(180deg, #e9f2ff, #f1ebff);
        color: #0f1b2e;
        font: 600 17px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        transition: opacity 0.25s ease-out;
      }
      #aw-splash.aw-splash--gone {
        opacity: 0;
        pointer-events: none;
      }
      #aw-splash img {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        box-shadow: 0 8px 24px rgba(10, 92, 255, 0.18);
      }
      #aw-splash .aw-splash__bar {
        position: relative;
        width: 160px;
        height: 4px;
        border-radius: 2px;
        overflow: hidden;
        background: rgba(10, 92, 255, 0.16);
      }
      #aw-splash .aw-splash__bar::after {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 40%;
        border-radius: 2px;
        background: #0a5cff;
        animation: aw-splash-slide 1.1s ease-in-out infinite;
      }
      @keyframes aw-splash-slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-color-scheme: dark) {
        #aw-splash {
          background: linear-gradient(180deg, #0b1233, #070b1f);
          color: #eaf0fd;
        }
        #aw-splash .aw-splash__bar {
          background: rgba(62, 155, 255, 0.22);
        }
        #aw-splash .aw-splash__bar::after {
          background: #3e9bff;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #aw-splash,
        #aw-splash .aw-splash__bar::after {
          animation: none;
          transition: none;
        }
        #aw-splash .aw-splash__bar::after {
          width: 100%;
          opacity: 0.5;
        }
      }
    </style>
  </head>
  <body>
    <div id="aw-splash" role="status" aria-live="polite">
      <img src="icons/Icon-192.png" alt="" width="72" height="72" />
      <span id="aw-splash-text">Opening AllisWell…</span>
      <div class="aw-splash__bar" role="progressbar" aria-label="Loading"></div>
    </div>
    <script>
      (function () {
        var splash = document.getElementById('aw-splash');
        try {
          if (/^tr\b/i.test(navigator.language || '')) {
            document.getElementById('aw-splash-text').textContent = 'AllisWell açılıyor…';
            splash.querySelector('[role="progressbar"]').setAttribute('aria-label', 'Yükleniyor');
          }
        } catch (e) {
          /* no language: the English line stays */
        }
        window.addEventListener(
          'flutter-first-frame',
          function () {
            splash.classList.add('aw-splash--gone');
            setTimeout(function () {
              if (splash.parentNode) splash.parentNode.removeChild(splash);
            }, 300);
          },
          { once: true },
        );
      })();
    </script>
    <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
