<!doctype html>
<!-- lang is updated at runtime to the active locale (OPH-128). -->
<html lang="en">
  <head>
    <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
    <base href="$FLUTTER_BASE_HREF" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="description" content="Tasks, projects, notes and alarm-grade reminders — with two-way Google & Apple Calendar sync. Open source and self-hostable." />

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="AllisWell" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <title>AllisWell</title>
    <link rel="manifest" href="manifest.json" />

    <!--
    Round 16 #2 — drag-selecting text in a note on FIREFOX drew the text twice:
    once by Flutter on the canvas and once, in 13 px monospace, on top of it.

    The culprit is `<textarea class="flt-text-editing">`, the hidden proxy the
    web engine keeps over the canvas for IME and the clipboard. It holds the
    real text and the engine hides it with `color: transparent`. But `color` is
    exactly what `::selection` overrides: the moment the engine mirrors the
    app's selection into that textarea, Firefox repaints the selected range in
    the SYSTEM selection colours and the invisible text becomes visible —
    misaligned, in the wrong font, over the real text. Chromium keeps the
    transparent colour for selected text, which is why this never showed there.

    Painting the selection is Flutter's job, on the canvas. The proxy must stay
    invisible in every state, so pin its selection colours to transparent.
    Separate rules on purpose: an unknown pseudo-element invalidates the whole
    selector, so `::-moz-selection` must not share a rule with `::selection`.
  -->
    <style>
      .flt-text-editing::selection {
        background-color: transparent;
        color: transparent;
      }
      .flt-text-editing::-moz-selection {
        background-color: transparent;
        color: transparent;
      }
    </style>

    <!--
    Runtime configuration (self-hosting): the published `alliswell-web` image
    rewrites this file from ALLISWELL_API_URL at container start, so one
    prebuilt bundle can serve any deployment. Loaded synchronously BEFORE
    flutter_bootstrap so the value is there on the first frame; when the file
    defines nothing, the compile-time --dart-define wins. See
    lib/src/core/runtime_config_web.dart.
  -->
    <script src="alliswell-config.js"></script>
  </head>
  <body>
    <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
