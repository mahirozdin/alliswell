org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# MUST stay true on AGP 9+. file_picker 11.0.2 (and other plugins) detect AGP 9
# and deliberately DON'T apply their own Kotlin Gradle Plugin, expecting Flutter
# to compile their Kotlin. With this false, nobody compiles it and the release
# build dies on `cannot find symbol FilePickerPlugin` — which is exactly what it
# did until 2026-07-26.
android.builtInKotlin=false
