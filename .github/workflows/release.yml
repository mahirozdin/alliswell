name: Release

# Cut a release by pushing a version tag:  git tag v0.1.0 && git push origin v0.1.0
# The tag is the trigger AND the version — everything else is derived from it.
on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never abandon a half-published release

jobs:
  # A tag must never publish code the test suite has not green-lit, so reuse the
  # exact CI workflow rather than a trimmed copy of it.
  gate:
    name: Test gate
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write # create the GitHub Release

    steps:
      - uses: actions/checkout@v5

      - name: Derive version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing v$version"

      # A mismatched tag (v0.2.0 while the code still says 0.1.0) is almost
      # always a mistake — fail loudly rather than ship a lie.
      - name: Verify the code declares this version
        run: |
          version="${{ steps.version.outputs.version }}"
          api=$(node -p "require('./apps/api/package.json').version")
          app=$(grep -m1 '^version:' apps/app/pubspec.yaml | sed -E 's/version:[[:space:]]*([0-9.]+).*/\1/')
          echo "tag=$version  api=$api  app=$app"
          if [ "$api" != "$version" ] || [ "$app" != "$version" ]; then
            echo "::error::Tag v$version does not match api ($api) / app ($app). Bump the versions first."
            exit 1
          fi

      # Release notes are the CHANGELOG's section for this version — one source
      # of truth, so the tag and the notes can never drift.
      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          version="${{ steps.version.outputs.version }}"
          # Grab the version section, but stop at the "Development log" marker
          # so the release shows the curated summary, not the whole history
          # (the full detail stays in CHANGELOG.md, linked below).
          notes=$(awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]"      { grab=1; next }
            grab && /^## \[/            { exit }
            grab && /^### Development log/ { exit }
            grab                       { print }
          ' CHANGELOG.md)
          footer="Full change detail: [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md)"
          notes="${notes}"$'\n\n---\n'"${footer}"
          if [ -z "$(echo "$notes" | tr -d '[:space:]')" ]; then
            echo "::error::No CHANGELOG section found for [$version]."
            exit 1
          fi
          {
            echo "body<<RELEASE_EOF"
            echo "$notes"
            echo "RELEASE_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true

      # The web bundle is the artifact a self-hoster actually wants — a static
      # build they can serve behind their own API. Desktop/mobile packaging is
      # roadmap (v2).
      - name: Build web bundle
        working-directory: apps/app
        run: |
          flutter pub get
          flutter build web --release

      - name: Package the web bundle
        run: |
          version="${{ steps.version.outputs.version }}"
          tar -C apps/app/build/web -czf "alliswell-web-$version.tar.gz" .

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: AllisWell v${{ steps.version.outputs.version }}
          body: ${{ steps.notes.outputs.body }}
          # A pre-1.0 tag is a preview; promote to a full release at 1.0.0.
          prerelease: ${{ !startsWith(steps.version.outputs.version, '1.') }}
          files: alliswell-web-${{ steps.version.outputs.version }}.tar.gz
          fail_on_unmatched_files: true

  # Self-hosting artifacts: one image per half of the product, so anyone can run
  # AllisWell with `docker compose up` and upgrade by pulling a newer tag
  # (docs/SELF-HOSTING.md). Multi-arch because half the self-hosting world is
  # arm64 now — Raspberry Pis, Ampere VPSes, Apple silicon.
  images:
    name: Publish container images
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push to ghcr.io

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            dockerfile: apps/api/Dockerfile
          - name: web
            context: .
            dockerfile: apps/app/Dockerfile

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v1.2.3 → :1.2.3, :1.2, :latest — so a self-hoster can pin exactly as
      # tightly as they want. `latest` only ever moves on a real release.
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/alliswell-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Ship the freshly-released tag to the maintainer's own instance. Runs only
  # when the deployment variables are configured, so forks and clones publish
  # releases without ever touching anyone's server.
  #
  # Order is deliberate: back up the database, migrate, restart the API, and
  # only THEN publish the web bundle — a browser must never load a build that
  # talks to an API which has not migrated yet. The job fails loudly if
  # /health/ready does not come back "ok".
  deploy:
    name: Deploy to production
    needs: release
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      APP_DIR: ${{ vars.DEPLOY_APP_DIR || '/www/wwwroot/alliswell' }}
      WEB_DIR: ${{ vars.DEPLOY_WEB_DIR || '/www/wwwroot/alliswell.space' }}
      PM2_APP: ${{ vars.DEPLOY_PM2_APP || 'alliswell-api' }}
      SSH_PORT: ${{ vars.DEPLOY_SSH_PORT || '22' }}
      API_URL: ${{ vars.DEPLOY_API_URL }}

    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true

      # The API base URL is compiled INTO the bundle, so production needs its
      # own build — the release artifact above is the generic one.
      - name: Build the web bundle for production
        working-directory: apps/app
        run: |
          test -n "$API_URL" || { echo "::error::vars.DEPLOY_API_URL is not set"; exit 1; }
          flutter pub get
          flutter build web --release --dart-define=ALLISWELL_API_URL="$API_URL"

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$SSH_PORT" -H "${{ secrets.DEPLOY_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # Everything that touches the server runs as ONE script, so a failure
      # anywhere (set -e) stops before the next stage.
      - name: Back up the database, migrate and restart the API
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" \
            "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}" \
            "APP_DIR='$APP_DIR' PM2_APP='$PM2_APP' TAG='${{ github.ref_name }}' DEPLOY_NODE_PATH='${{ vars.DEPLOY_NODE_PATH }}' bash -euo pipefail" <<'REMOTE'
          cd "$APP_DIR"

          # A non-interactive SSH session does not source the login profile, and
          # panels (aaPanel et al.) install Node outside the default PATH — so
          # node/npm/pm2 must be put on it explicitly or this fails at `npm ci`.
          for d in ${DEPLOY_NODE_PATH:-} /www/server/nodejs/v*/bin; do
            [ -d "$d" ] && PATH="$d:$PATH"
          done
          export PATH
          for bin in node npm pm2 mysqldump git; do
            command -v "$bin" >/dev/null || { echo "ERROR: '$bin' not found in PATH ($PATH)"; exit 1; }
          done
          echo "node $(node -v) · npm $(npm -v) · $(pm2 -v 2>/dev/null | tail -1)"

          # Read DB credentials from the app's own .env (never duplicated into
          # CI secrets, so they cannot drift apart). Values are read line-wise
          # rather than sourced: a `.env` is data, not a shell script.
          env_get() { grep -E "^$1=" apps/api/.env | head -1 | cut -d= -f2-; }
          DB_HOST=$(env_get DATABASE_HOST); DB_PORT=$(env_get DATABASE_PORT)
          DB_USER=$(env_get DATABASE_USER); DB_PASS=$(env_get DATABASE_PASSWORD)
          DB_NAME=$(env_get DATABASE_NAME)

          # 1. Backup FIRST — migrations are forward-only; this is the undo.
          BACKUP_DIR=/www/backup/alliswell
          mkdir -p "$BACKUP_DIR"
          stamp=$(date +%Y%m%d-%H%M%S)
          MYSQL_PWD="$DB_PASS" mysqldump -h"$DB_HOST" -P"$DB_PORT" -u"$DB_USER" \
            --single-transaction --routines --triggers "$DB_NAME" \
            | gzip > "$BACKUP_DIR/db-$stamp-pre-$TAG.sql.gz"
          echo "backup: $BACKUP_DIR/db-$stamp-pre-$TAG.sql.gz ($(du -h "$BACKUP_DIR/db-$stamp-pre-$TAG.sql.gz" | cut -f1))"
          # Keep the 10 most recent backups.
          ls -1t "$BACKUP_DIR"/db-*.sql.gz 2>/dev/null | tail -n +11 | xargs -r rm --

          # 2. Check out the EXACT released tag (detached HEAD on purpose — the
          #    server runs a release, not "whatever main happens to be").
          git fetch --tags --force --prune origin
          git checkout -f "$TAG"
          echo "checked out: $(git describe --tags --always)"

          # 3. Dependencies + schema. knex/mysql2 are prod deps, so --omit=dev
          #    still migrates. Migrations are append-only: data is preserved.
          npm ci --omit=dev
          npm run db:migrate

          # 4. Restart the API with the (unchanged) .env re-read.
          pm2 restart "$PM2_APP" --update-env
          pm2 save || true
          REMOTE

      # Only now may the browser get the new bundle. --delete prunes the old
      # Flutter hashes; .htaccess is server-owned (SPA routing) and must live.
      - name: Publish the web bundle
        run: |
          rsync -az --delete --exclude='.htaccess' \
            -e "ssh -i ~/.ssh/id_deploy -p $SSH_PORT" \
            apps/app/build/web/ \
            "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}:$WEB_DIR/"

      # A deploy that "succeeded" while the API is down is the failure mode
      # this whole pipeline exists to prevent.
      - name: Verify the deployment is healthy
        run: |
          for attempt in $(seq 1 20); do
            body=$(curl -fsS --max-time 10 "$API_URL/health/ready" || true)
            echo "attempt $attempt: $body"
            case "$body" in
              *'"status":"ok"'*) echo "healthy"; exit 0 ;;
            esac
            sleep 5
          done
          echo "::error::/health/ready never reported ok — the API is degraded or down."
          echo "Investigate on the server: pm2 logs $PM2_APP --lines 50"
          echo "The pre-deploy database backup is in /www/backup/alliswell/."
          exit 1
