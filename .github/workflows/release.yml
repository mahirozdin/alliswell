name: Release

# Cut a release by pushing a version tag:  git tag v0.1.0 && git push origin v0.1.0
# The tag is the trigger AND the version — everything else is derived from it.
on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never abandon a half-published release

jobs:
  # A tag must never publish code the test suite has not green-lit, so reuse the
  # exact CI workflow rather than a trimmed copy of it.
  gate:
    name: Test gate
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write # create the GitHub Release

    steps:
      - uses: actions/checkout@v5

      - name: Derive version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing v$version"

      # A mismatched tag (v0.2.0 while the code still says 0.1.0) is almost
      # always a mistake — fail loudly rather than ship a lie.
      - name: Verify the code declares this version
        run: |
          version="${{ steps.version.outputs.version }}"
          api=$(node -p "require('./apps/api/package.json').version")
          app=$(grep -m1 '^version:' apps/app/pubspec.yaml | sed -E 's/version:[[:space:]]*([0-9.]+).*/\1/')
          # The string the app SHOWS (Settings ▸ About). It sat at 0.1.0 for
          # three releases because nothing checked it.
          shown=$(grep -m1 "^const kAppVersion" apps/app/lib/src/core/app_version.dart \
                  | sed -E "s/.*'([0-9.]+)'.*/\1/")
          echo "tag=$version  api=$api  app=$app  shown=$shown"
          if [ "$api" != "$version" ] || [ "$app" != "$version" ] || [ "$shown" != "$version" ]; then
            echo "::error::Tag v$version does not match api ($api) / app ($app) / kAppVersion ($shown). Bump them first."
            exit 1
          fi

      # Release notes are the CHANGELOG's section for this version — one source
      # of truth, so the tag and the notes can never drift.
      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          version="${{ steps.version.outputs.version }}"
          # Grab the version section, but stop at the "Development log" marker
          # so the release shows the curated summary, not the whole history
          # (the full detail stays in CHANGELOG.md, linked below).
          notes=$(awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]"      { grab=1; next }
            grab && /^## \[/            { exit }
            grab && /^### Development log/ { exit }
            grab                       { print }
          ' CHANGELOG.md)
          footer="Full change detail: [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md)"
          notes="${notes}"$'\n\n---\n'"${footer}"
          if [ -z "$(echo "$notes" | tr -d '[:space:]')" ]; then
            echo "::error::No CHANGELOG section found for [$version]."
            exit 1
          fi
          {
            echo "body<<RELEASE_EOF"
            echo "$notes"
            echo "RELEASE_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true

      # The web bundle is the artifact a self-hoster actually wants — a static
      # build they can serve behind their own API. The Windows and Linux desktop
      # apps come from the `desktop` job below and are attached by
      # `desktop-attach` (ADR-0051); mobile ships through the stores.
      - name: Build web bundle
        working-directory: apps/app
        run: |
          flutter pub get
          flutter build web --release

      - name: Package the web bundle
        run: |
          version="${{ steps.version.outputs.version }}"
          tar -C apps/app/build/web -czf "alliswell-web-$version.tar.gz" .

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: AllisWell v${{ steps.version.outputs.version }}
          body: ${{ steps.notes.outputs.body }}
          # A pre-1.0 tag is a preview; 1.0.0 and every later major is a full
          # release — `releases/latest/download/...` (README, landing, ADR-0051)
          # only ever resolves to a non-prerelease, so 2.x must not be one.
          prerelease: ${{ startsWith(steps.version.outputs.version, '0.') }}
          files: alliswell-web-${{ steps.version.outputs.version }}.tar.gz
          fail_on_unmatched_files: true

  # Desktop apps for people who will never self-host: a Windows zip and a Linux
  # tar.gz on every release (ADR-0051). Deliberately outside the deploy chain —
  # a desktop build failure must never hold back production. Asset names carry
  # no version so README/landing can link releases/latest/download/<name>; the
  # version is the archive's top folder and is compiled in with --build-name.
  desktop:
    name: Desktop build (${{ matrix.target }})
    needs: gate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60 # pdfium and the Firebase C++ SDK download at configure time
    permissions:
      contents: read
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            runner: ubuntu-24.04
            asset: alliswell-linux-x64.tar.gz
          - target: windows
            runner: windows-2025
            asset: alliswell-windows-x64.zip

    steps:
      - uses: actions/checkout@v5

      - name: Derive version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          app=$(grep -m1 '^version:' apps/app/pubspec.yaml | sed -E 's/version:[[:space:]]*([0-9.]+).*/\1/')
          shown=$(grep -m1 "^const kAppVersion" apps/app/lib/src/core/app_version.dart \
                  | sed -E "s/.*'([0-9.]+)'.*/\1/")
          echo "tag=$version  app=$app  shown=$shown"
          if [ "$app" != "$version" ] || [ "$shown" != "$version" ]; then
            echo "::error::Tag v$version does not match app ($app) / kAppVersion ($shown) — no mislabelled desktop build."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev \
            liblzma-dev libstdc++-12-dev libsecret-1-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true

      - name: Build the ${{ matrix.target }} release bundle
        working-directory: apps/app
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          flutter pub get
          flutter build ${{ matrix.target }} --release --build-name="$VERSION"

      - name: Package the Linux bundle
        if: matrix.target == 'linux'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ASSET: ${{ matrix.asset }}
        run: |
          dir="alliswell-$VERSION-linux-x64"
          mkdir -p dist/stage
          cp -a apps/app/build/linux/x64/release/bundle "dist/stage/$dir"
          test -x "dist/stage/$dir/alliswell"
          # Every shared library the binary links must resolve — a missing one
          # here is a missing one on every user's desktop.
          if ldd "dist/stage/$dir/alliswell" | grep 'not found'; then
            echo "::error::the Linux bundle links a library that is not shipped"
            exit 1
          fi
          tar -C dist/stage -czf "dist/$ASSET" "$dir"
          ls -l dist

      # Flutter's Windows bundle does not carry the VC++ runtime; a PC without
      # the redistributable fails with "MSVCP140.dll was not found". Ship the
      # three DLLs app-local from the runner's Visual Studio (ADR-0051).
      - name: Package the Windows bundle
        if: matrix.target == 'windows'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ASSET: ${{ matrix.asset }}
        run: |
          $ErrorActionPreference = 'Stop'
          $rel = 'apps/app/build/windows/x64/runner/Release'
          if (-not (Test-Path "$rel/alliswell.exe")) { throw "alliswell.exe was not built" }
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory |
            Where-Object { Test-Path "$($_.FullName)\vcruntime140_1.dll" } |
            Sort-Object FullName | Select-Object -Last 1
          if ($null -eq $crt) { throw "no VC++ runtime found under $vs" }
          Copy-Item "$($crt.FullName)\msvcp140.dll", "$($crt.FullName)\vcruntime140.dll", "$($crt.FullName)\vcruntime140_1.dll" $rel
          $dir = "alliswell-$env:VERSION-windows-x64"
          New-Item dist/stage -ItemType Directory -Force | Out-Null
          Copy-Item $rel "dist/stage/$dir" -Recurse
          Compress-Archive -Path "dist/stage/$dir" -DestinationPath "dist/$env:ASSET"
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  # Attaches whatever desktop builds succeeded to the Release `release` created,
  # then goes red if a leg failed — a half-attached release must not look done.
  desktop-attach:
    name: Attach desktop downloads
    needs: [release, desktop]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # upload release assets

    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true # both legs failed → nothing to download; the last step says so
        with:
          pattern: desktop-*
          merge-multiple: true
          path: dist

      - name: Upload to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          mkdir -p dist
          files=(dist/alliswell-*-x64.*)
          echo "### Desktop downloads" >> "$GITHUB_STEP_SUMMARY"
          if [ ${#files[@]} -eq 0 ]; then
            echo "No desktop build to attach." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          (cd dist && sha256sum alliswell-*-x64.* > alliswell-desktop-SHA256SUMS.txt)
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" dist/alliswell-desktop-SHA256SUMS.txt \
            --clobber --repo "$GITHUB_REPOSITORY"
          for f in "${files[@]}"; do echo "- \`$(basename "$f")\`" >> "$GITHUB_STEP_SUMMARY"; done

      - name: Fail if a desktop build failed
        if: ${{ needs.desktop.result != 'success' }}
        env:
          RESULT: ${{ needs.desktop.result }}
        run: |
          echo "::error::a desktop build did not succeed ($RESULT) — only the files listed in the summary were attached"
          exit 1

  # Self-hosting artifacts: one image per half of the product, so anyone can run
  # AllisWell with `docker compose up` and upgrade by pulling a newer tag
  # (docs/SELF-HOSTING.md). Multi-arch because half the self-hosting world is
  # arm64 now — Raspberry Pis, Ampere VPSes, Apple silicon.
  images:
    name: Publish container images
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push to ghcr.io

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            dockerfile: apps/api/Dockerfile
          - name: web
            context: .
            dockerfile: apps/app/Dockerfile

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v1.2.3 → :1.2.3, :1.2, :latest — so a self-hoster can pin exactly as
      # tightly as they want. `latest` only ever moves on a real release.
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/alliswell-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Ship the freshly-released tag to the maintainer's own instance. The steps
  # live in deploy.yml so the exact same path is available by hand (Actions ▸
  # Deploy ▸ Run workflow) when a redeploy is needed without cutting a version.
  #
  # Exactly one of the next two jobs runs. With `vars.DEPLOY_VIA_OVERLAY` set to
  # 'true', the overlay's private repository (`secrets.DEPLOY_OVERLAY_REPO`)
  # runs deploy.yml from its own Deploy workflow, on a runner that lives on the
  # server (ADR-0043) — a public repository must never hold such a runner, so
  # this one only starts it there. Otherwise deploy.yml runs here on GitHub's
  # runner, exactly as before. The repository's name stays a secret either way.
  deploy:
    name: Deploy
    needs: [release, images]
    if: vars.DEPLOY_VIA_OVERLAY != 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ github.ref_name }}
    secrets: inherit

  deploy-dispatch:
    name: Deploy (on the server's runner)
    needs: [release, images]
    if: vars.DEPLOY_VIA_OVERLAY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A fine-grained token scoped to that one repository with Actions: write —
      # enough to start a workflow there, nothing else. So the dispatch is the
      # REST call itself: `gh workflow run` first asks GraphQL for the default
      # branch, which that token cannot read ("Resource not accessible by
      # personal access token (repository.defaultBranchRef)" — v1.14.0's run).
      - name: Start the deploy in the overlay's repository
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          REPO: ${{ secrets.DEPLOY_OVERLAY_REPO }}
          TAG: ${{ github.ref_name }}
        run: |
          test -n "$GH_TOKEN" || { echo "::error::secrets.DEPLOY_DISPATCH_TOKEN is not set — nothing can start the deploy"; exit 1; }
          test -n "$REPO" || { echo "::error::secrets.DEPLOY_OVERLAY_REPO is not set — there is no repository to start the deploy in"; exit 1; }
          gh api -X POST "repos/$REPO/actions/workflows/deploy.yml/dispatches" \
            -f ref=main -f "inputs[ref]=$TAG"
          echo "### Deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "Started for $TAG in the overlay's repository — follow it there: Actions ▸ Deploy." >> "$GITHUB_STEP_SUMMARY"
