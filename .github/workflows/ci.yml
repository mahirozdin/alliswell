name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Callable so the release workflow gates on the exact same suite instead of
  # duplicating it — a tag never publishes code CI has not green-lit.
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, tests, migrations)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root
          MYSQL_DATABASE: alliswell
          MYSQL_USER: alliswell
          MYSQL_PASSWORD: alliswell_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pci_root --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30

    env:
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: '3306'
      DATABASE_USER: alliswell
      DATABASE_PASSWORD: alliswell_ci
      DATABASE_NAME: alliswell
      REDIS_URL: redis://127.0.0.1:6379

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Policy — no TypeScript
        run: npm run check:no-ts

      - name: Policy — no EE overlay files tracked
        run: npm run check:no-ee

      - name: Policy — no hardcoded app strings (i18n)
        run: npm run check:i18n

      - name: Policy — docs do not claim a stale version
        run: npm run check:docs

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Run migrations (fresh MySQL)
        run: npm run db:migrate

      - name: Rollback + re-apply migrations (down() paths work)
        run: npm run db:rollback && npm run db:migrate

      # Service containers cannot override an image's command, and minio/minio
      # needs `server /data` — so MinIO (the R2 stand-in for the attachments
      # integration tests, docs/ATTACHMENTS.md) starts as a plain container.
      # Credentials match the docker-compose defaults the tests assume; the
      # test bootstrap creates the bucket itself (with retries), so no
      # healthcheck choreography is needed.
      - name: Start MinIO (attachments storage)
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=alliswell -e MINIO_ROOT_PASSWORD=alliswell_dev \
            minio/minio:latest server /data

      - name: Integration tests
        run: npm run test:integration

  # MariaDB is a supported deployment target (many shared hosts / aaPanel ship
  # it instead of MySQL), and it has NO utf8mb4_0900_* collation — the schema
  # resolves one per server (src/db/collation.js). That resolution, and the rest
  # of the SQL surface (FULLTEXT, MATCH…AGAINST, enum MODIFY), can only stay
  # correct if it is exercised: this job is that guarantee. Lint/unit/policy
  # steps stay in the MySQL job — this one is purely schema + integration.
  api-mariadb:
    name: API on MariaDB (migrations, integration)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mariadb:
        # 10.11 LTS — the conservative floor; newer MariaDB is a superset.
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci_root
          MARIADB_DATABASE: alliswell
          MARIADB_USER: alliswell
          MARIADB_PASSWORD: alliswell_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30

    env:
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: '3306'
      DATABASE_USER: alliswell
      DATABASE_PASSWORD: alliswell_ci
      DATABASE_NAME: alliswell
      REDIS_URL: redis://127.0.0.1:6379

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run migrations (fresh MariaDB)
        run: npm run db:migrate

      - name: Assert the schema fell back to utf8mb4_unicode_ci
        run: |
          mysql -h 127.0.0.1 -ualliswell -palliswell_ci alliswell -N -e \
            "SELECT table_collation FROM information_schema.tables
             WHERE table_schema='alliswell' AND table_name='users';" | grep -qx 'utf8mb4_unicode_ci'

      - name: Rollback + re-apply migrations (down() paths work)
        run: npm run db:rollback && npm run db:migrate

      - name: Start MinIO (attachments storage)
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=alliswell -e MINIO_ROOT_PASSWORD=alliswell_dev \
            minio/minio:latest server /data

      - name: Integration tests
        run: npm run test:integration

  app:
    name: Flutter (analyze, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: apps/app

    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test

  # OPH-244 / ADR-0027: the release APK must declare exactly the permissions we
  # intend. Plugins contribute <uses-permission> at BUILD time and
  # tools:node="remove" is silent when it matches nothing, so no Dart test can
  # see this — only the built package can. A separate job so the fast app lane
  # (analyze + tests) stays fast.
  android-manifest:
    name: Android (release manifest declares no media permission)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: apps/app

      - name: Assert the shipped permission set
        run: bash scripts/android/assert-permissions.sh

  landing:
    name: Landing site (lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # OPH-274: this step is why the landing's `lint` script could sit broken
      # since the workspace was created — it existed, it failed, and nothing
      # ever called it. A script CI does not run is a claim, not a check.
      - name: Lint
        run: npm run lint -w @alliswell/landing

      - name: Build
        run: npm run landing:build

      # The site's whole job is showing the product, so a build that quietly
      # produced a page of broken frames is a failure worth catching here rather
      # than on the domain. Every `/shots/...` the markup references must exist
      # in the built output.
      - name: Every referenced screenshot exists
        run: |
          missing=0
          for ref in $(grep -rhoE "/shots/[A-Za-z0-9/_.-]+\.(jpg|png)" apps/landing/src | sort -u); do
            if [ ! -f "apps/landing/dist${ref}" ]; then
              echo "::error::missing $ref — regenerate with docs/SCREENSHOTS.md"
              missing=1
            fi
          done
          exit $missing

      - name: The docroot contract holds
        run: |
          test -f apps/landing/dist/index.html || { echo "::error::no index.html"; exit 1; }
          test -f apps/landing/dist/.htaccess  || { echo "::error::no .htaccess — /app routing would break"; exit 1; }
          grep -q 'RewriteRule \^app' apps/landing/dist/.htaccess \
            || { echo "::error::.htaccess lost its /app rule"; exit 1; }

      # Apple and Google both FETCH these URLs during review and reject a 404.
      # They are generated from docs/*.md, so a rename there silently removes a
      # store requirement — this is the check that notices.
      - name: The legal pages the stores require are present
        run: |
          fail=0
          for page in privacy privacy/tr support support/tr; do
            f="apps/landing/dist/$page/index.html"
            if [ ! -f "$f" ]; then
              echo "::error::missing /$page — the stores fetch this URL"; fail=1; continue
            fi
            grep -q 'info@bubiapps.com' "$f" \
              || { echo "::error::/$page has no contact address"; fail=1; }
          done
          grep -q 'BUBIAPSS BILGI TEKNOLOJILERI ARGE LIMITED SIRKETI' apps/landing/dist/privacy/index.html \
            || { echo "::error::the privacy policy does not name the data controller"; fail=1; }
          exit $fail
