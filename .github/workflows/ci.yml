name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Callable so the release workflow gates on the exact same suite instead of
  # duplicating it — a tag never publishes code CI has not green-lit.
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, tests, migrations)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root
          MYSQL_DATABASE: alliswell
          MYSQL_USER: alliswell
          MYSQL_PASSWORD: alliswell_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pci_root --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30

    env:
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: '3306'
      DATABASE_USER: alliswell
      DATABASE_PASSWORD: alliswell_ci
      DATABASE_NAME: alliswell
      REDIS_URL: redis://127.0.0.1:6379

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Policy — no TypeScript
        run: npm run check:no-ts

      - name: Policy — no EE overlay files tracked
        run: npm run check:no-ee

      - name: Policy — no hardcoded app strings (i18n)
        run: npm run check:i18n

      - name: Policy — docs do not claim a stale version
        run: npm run check:docs

      - name: Policy — no bare extended FABs (the theme's circle eats the icon)
        run: npm run check:fab

      # OPH-294: the reference, the spec and the Postman collection are all
      # generated from the route schemas. These three gates are what make that
      # true tomorrow as well — a route whose schema changes without the docs
      # being regenerated fails here, which is the only reason a generated
      # reference is worth more than a hand-written one.
      - name: Docs — the OpenAPI spec matches the routes
        run: npm run check:openapi

      - name: Docs — the API reference matches the spec
        run: npm run check:apidocs

      - name: Docs — the Postman collection matches the spec
        run: npm run check:postman

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Run migrations (fresh MySQL)
        run: npm run db:migrate

      - name: Rollback + re-apply migrations (down() paths work)
        run: npm run db:rollback && npm run db:migrate

      # Service containers cannot override an image's command, and minio/minio
      # needs `server /data` — so MinIO (the R2 stand-in for the attachments
      # integration tests, docs/ATTACHMENTS.md) starts as a plain container.
      # Credentials match the docker-compose defaults the tests assume; the
      # test bootstrap creates the bucket itself (with retries), so no
      # healthcheck choreography is needed.
      - name: Start MinIO (attachments storage)
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=alliswell -e MINIO_ROOT_PASSWORD=alliswell_dev \
            minio/minio:latest server /data

      - name: Integration tests
        run: npm run test:integration

  # MariaDB is a supported deployment target (many shared hosts / aaPanel ship
  # it instead of MySQL), and it has NO utf8mb4_0900_* collation — the schema
  # resolves one per server (src/db/collation.js). That resolution, and the rest
  # of the SQL surface (FULLTEXT, MATCH…AGAINST, enum MODIFY), can only stay
  # correct if it is exercised: this job is that guarantee. Lint/unit/policy
  # steps stay in the MySQL job — this one is purely schema + integration.
  api-mariadb:
    name: API on MariaDB (migrations, integration)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mariadb:
        # 10.11 LTS — the conservative floor; newer MariaDB is a superset.
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci_root
          MARIADB_DATABASE: alliswell
          MARIADB_USER: alliswell
          MARIADB_PASSWORD: alliswell_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30

    env:
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: '3306'
      DATABASE_USER: alliswell
      DATABASE_PASSWORD: alliswell_ci
      DATABASE_NAME: alliswell
      REDIS_URL: redis://127.0.0.1:6379

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run migrations (fresh MariaDB)
        run: npm run db:migrate

      - name: Assert the schema fell back to utf8mb4_unicode_ci
        run: |
          mysql -h 127.0.0.1 -ualliswell -palliswell_ci alliswell -N -e \
            "SELECT table_collation FROM information_schema.tables
             WHERE table_schema='alliswell' AND table_name='users';" | grep -qx 'utf8mb4_unicode_ci'

      - name: Rollback + re-apply migrations (down() paths work)
        run: npm run db:rollback && npm run db:migrate

      - name: Start MinIO (attachments storage)
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=alliswell -e MINIO_ROOT_PASSWORD=alliswell_dev \
            minio/minio:latest server /data

      - name: Integration tests
        run: npm run test:integration

  app:
    name: Flutter (analyze, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: apps/app

    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test

  # OPH-244 / ADR-0027: the release APK must declare exactly the permissions we
  # intend. Plugins contribute <uses-permission> at BUILD time and
  # tools:node="remove" is silent when it matches nothing, so no Dart test can
  # see this — only the built package can. A separate job so the fast app lane
  # (analyze + tests) stays fast.
  android-manifest:
    name: Android (release manifest declares no media permission)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: apps/app

      - name: Assert the shipped permission set
        run: bash scripts/android/assert-permissions.sh

  landing:
    name: Landing site (lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # OPH-274: this step is why the landing's `lint` script could sit broken
      # since the workspace was created — it existed, it failed, and nothing
      # ever called it. A script CI does not run is a claim, not a check.
      - name: Lint
        run: npm run lint -w @alliswell/landing

      - name: Build
        run: npm run landing:build

      # The site's whole job is showing the product, so a build that quietly
      # produced a page of broken frames is a failure worth catching here rather
      # than on the domain. Every `/shots/...` the markup references must exist
      # in the built output.
      #
      # EE-119: this used to scan `apps/landing/src`, which is only where the
      # VUE app's references live. The static pages are generated by
      # scripts/static-pages.js out of `docs/*.md`, so a broken frame on one of
      # those was invisible to a gate that nevertheless reported success.
      # Scanning the BUILT OUTPUT covers every page however it was produced, and
      # cannot go blind again the next time a page arrives by a new mechanism.
      - name: Every referenced screenshot exists
        run: |
          missing=0

          # Shape 1: literal paths, written out in the markup.
          for ref in $(grep -rhoE "/shots/[A-Za-z0-9/_.-]+\.(jpg|png)" \
                         --include='*.html' --include='*.js' --include='*.css' \
                         apps/landing/dist | sort -u); do
            if [ ! -f "apps/landing/dist${ref}" ]; then
              echo "::error::missing $ref — regenerate with docs/SCREENSHOTS.md"
              missing=1
            fi
          done

          # Shape 2: paths the feature section COMPOSES at render time —
          # `:src="`/shots/${feature.shot}`"` — with the filenames living in
          # content.js without the /shots/ prefix. No literal to grep, so the
          # scan above never saw a single one of them: it found 7 of the 18
          # references this site actually makes, and had done since the gate was
          # written. Renaming a screenshot in content.js shipped a broken frame
          # with CI green. Read the fields from content.js rather than repeating
          # them here, so a new feature row is covered the day it is added.
          for ref in $(node -e "import('./apps/landing/src/content.js').then(m=>m.features.flatMap(f=>[f.shot,f.shotDark]).filter(Boolean).forEach(s=>console.log(s)))" | sort -u); do
            if [ ! -f "apps/landing/dist/shots/$ref" ]; then
              echo "::error::missing /shots/$ref — referenced from content.js"
              missing=1
            fi
          done

          exit $missing

      - name: The docroot contract holds
        run: |
          test -f apps/landing/dist/index.html || { echo "::error::no index.html"; exit 1; }
          test -f apps/landing/dist/.htaccess  || { echo "::error::no .htaccess — /app routing would break"; exit 1; }
          grep -q 'RewriteRule \^app' apps/landing/dist/.htaccess \
            || { echo "::error::.htaccess lost its /app rule"; exit 1; }

      # EE-150. The site has been serving raw PNG bytes under `.jpg` names since
      # it shipped: sync-screenshots re-encoded only with macOS `sips`, and the
      # deploy runs on ubuntu-latest. The fallback called itself "heavier but
      # correct", which was a defensible trade at eight references and is not
      # one at the thirty the enterprise page carries.
      #
      # The encoder is a chain now (sips → magick → convert). This is the gate
      # that stops the silent path shipping twice: the largest legitimately
      # encoded image in the docroot is around 260 kB, and an un-encoded PNG is
      # several times that.
      - name: The screenshots were actually re-encoded
        run: |
          heavy=$(find apps/landing/dist/shots -name '*.jpg' -size +400k)
          if [ -n "$heavy" ]; then
            echo "::error::a served .jpg is over 400 kB — the re-encoder did not run"
            echo "$heavy" | while read -r f; do echo "  $(du -h "$f" | cut -f1)  $f"; done
            echo "sync-screenshots.mjs falls back to copying PNGs under a .jpg name"
            echo "when no encoder is present; install sips, magick or convert."
            exit 1
          fi

      # EE-150. `og:image` pointed at /og-cover.png, a file produced only by
      # `npm run shots:store` — which no workflow runs and which needs a Chrome
      # the deploy runner does not have — and kept untracked by .gitignore. The
      # URL still answered 200, because .htaccess rewrites anything missing to
      # index.html, so every share of the homepage rendered a blank card and no
      # HTTP check could ever have said so.
      #
      # Hence: the file in the BUILT docroot, not a status code.
      - name: Every og:image is a real file in the docroot
        run: |
          fail=0
          refs=$(grep -rhoE 'property="og:image" content="https://alliswell\.space[^"]+"' \
                   apps/landing/dist --include='*.html' \
                 | sed -E 's#.*alliswell\.space##; s#"$##' | sort -u)
          test -n "$refs" || { echo "::error::no og:image anywhere — social shares have no card"; exit 1; }
          for ref in $refs; do
            f="apps/landing/dist${ref}"
            if [ ! -f "$f" ]; then
              echo "::error::og:image ${ref} is not in the docroot — every share of that page is a blank card"
              fail=1
            elif ! file -b --mime-type "$f" | grep -q '^image/'; then
              echo "::error::og:image ${ref} is served but is not an image ($(file -b --mime-type "$f"))"
              fail=1
            fi
          done
          exit $fail

      # Every page in the docroot is present and a crawler can read it.
      #
      # EE-144 moved the assertions into apps/landing/scripts/check-pages.mjs
      # and the route list into scripts/routes.js. Two reasons, and the second
      # is the one that mattered:
      #
      # 1. A gate that only runs in CI is a gate nobody can prove. `npm run
      #    check:pages` runs the same checks on a built dist/ in a second.
      # 2. The bash version matched raw LINES, so it silently only ever covered
      #    the generated pages. apps/landing/index.html writes its meta
      #    description across three lines and closes its canonical with ` />` —
      #    so the site's most important page was outside the gate that asks
      #    whether pages are indexable. The script flattens first and now
      #    covers it. Proven by injection: deleting that multi-line tag turns
      #    the gate red, which the grep could never have done.
      #
      # The route list is IMPORTED rather than retyped, and now covers BOTH
      # producers. This gate used to carry its own hand-typed copy of four
      # routes, which meant a page added to the plugin was a page nothing
      # verified — and a gate whose set excludes the new thing is
      # indistinguishable, in the log, from a gate that passed.
      - name: Every page in the docroot is present and indexable
        run: npm run check:pages

      # EE-121: the enterprise page is reached from three places, and all three
      # are prose or a config array that nothing else would notice going stale.
      # The page could quietly become an orphan — present in the bundle, passing
      # the check above, and linked from nowhere.
      #
      # The site's two links are asserted against the BUILT bundle rather than
      # the components, so a refactor that drops them from the rendered output
      # fails here even if the source array still looks right. The two document
      # links are asserted as file references that resolve, because README and
      # SELF-HOSTING are read on GitHub long before the site redeploys.
      - name: The enterprise page is reachable from all three sources
        run: |
          fail=0
          grep -rq "/enterprise" apps/landing/dist/assets/*.js \
            || { echo "::error::the marketing bundle no longer links to /enterprise"; fail=1; }
          grep -q "docs/ENTERPRISE.md" README.md \
            || { echo "::error::README no longer links to the enterprise page"; fail=1; }
          grep -q "(ENTERPRISE.md)" docs/SELF-HOSTING.md \
            || { echo "::error::SELF-HOSTING no longer points at the enterprise page"; fail=1; }
          for f in docs/ENTERPRISE.md docs/ENTERPRISE.tr.md; do
            test -f "$f" || { echo "::error::$f is missing — the links above point at nothing"; fail=1; }
          done
          exit $fail

      # OPH-295, same failure mode as EE-121 and a worse history: the REST API
      # shipped in v1.7.0 and this site did not mention it ONCE for two
      # releases, which is most of why it was reported missing. A page nobody
      # links to is a page nobody finds.
      #
      # Asserted against the BUILT bundle, so a refactor that drops the nav or
      # footer entry fails here even when the source array still looks right.
      - name: The API reference is reachable, and its downloads exist
        run: |
          fail=0
          grep -rq "/docs/api" apps/landing/dist/assets/*.js \
            || { echo "::error::the marketing bundle no longer links to /docs/api"; fail=1; }
          test -f apps/landing/dist/docs/api/index.html \
            || { echo "::error::/docs/api was not generated into the bundle"; fail=1; }
          grep -q "docs/API.md" README.md \
            || { echo "::error::README no longer links to the API reference"; fail=1; }
          test -f apps/landing/dist/downloads/alliswell.postman_collection.json \
            || { echo "::error::the Postman collection is not in the bundle — the download 404s"; fail=1; }
          exit $fail

      # Apple and Google both FETCH these URLs during review and reject a 404.
      # They are generated from docs/*.md, so a rename there silently removes a
      # store requirement — this is the check that notices. The subset comes
      # from the generator too: these obligations belong to the legal pages, and
      # /enterprise must not be held to them or exempt from the check above.
      - name: The legal pages the stores require are present
        run: |
          fail=0
          required=$(node -e "import('./apps/landing/scripts/static-pages.js').then(m=>m.STORE_REQUIRED_ROUTES.forEach(r=>console.log(r)))")
          test -n "$required" || { echo "::error::no store-required routes listed"; exit 1; }
          for page in $required; do
            f="apps/landing/dist/$page/index.html"
            if [ ! -f "$f" ]; then
              echo "::error::missing /$page — the stores fetch this URL"; fail=1; continue
            fi
            grep -q 'info@bubiapps.com' "$f" \
              || { echo "::error::/$page has no contact address"; fail=1; }
          done
          grep -q 'BUBIAPSS BILGI TEKNOLOJILERI ARGE LIMITED SIRKETI' apps/landing/dist/privacy/index.html \
            || { echo "::error::the privacy policy does not name the data controller"; fail=1; }
          exit $fail
