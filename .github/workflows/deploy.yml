name: Deploy

# Ship a released tag to the maintainer's own instance.
#
# Called by release.yml after a tag's tests, release and images are green, and
# runnable by hand (Actions ▸ Deploy ▸ Run workflow) to redeploy an existing tag
# without minting a version — the same path, so a manual redeploy is never a
# different, less-tested procedure.
on:
  workflow_call:
    inputs:
      ref:
        description: The tag to deploy.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Tag to deploy, e.g. v0.4.0
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false # never interrupt a half-applied deploy

jobs:
  deploy:
    name: Deploy to production
    # Configured only on the upstream repo, so forks and clones can run
    # everything else without ever touching someone's server.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      APP_DIR: ${{ vars.DEPLOY_APP_DIR || '/www/wwwroot/alliswell' }}
      WEB_DIR: ${{ vars.DEPLOY_WEB_DIR || '/www/wwwroot/alliswell.space' }}
      PM2_APP: ${{ vars.DEPLOY_PM2_APP }}
      SSH_PORT: ${{ vars.DEPLOY_SSH_PORT || '22' }}
      API_URL: ${{ vars.DEPLOY_API_URL }}
      DEPLOY_REF: ${{ inputs.ref }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true

      # The API base URL is compiled INTO the bundle, so production needs its
      # own build — the release artifact is the generic one.
      - name: Build the web bundle for production
        working-directory: apps/app
        run: |
          test -n "$API_URL" || { echo "::error::vars.DEPLOY_API_URL is not set"; exit 1; }
          flutter pub get
          flutter build web --release --dart-define=ALLISWELL_API_URL="$API_URL"

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$SSH_PORT" -H "${{ secrets.DEPLOY_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # Everything that touches the server runs as ONE script, so a failure
      # anywhere (set -e) stops before the next stage.
      - name: Back up the database, migrate and restart the API
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" \
            "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}" \
            "APP_DIR='$APP_DIR' PM2_APP='$PM2_APP' TAG='$DEPLOY_REF' DEPLOY_NODE_PATH='${{ vars.DEPLOY_NODE_PATH }}' bash -euo pipefail" <<'REMOTE'
          cd "$APP_DIR"

          # A non-interactive SSH session sources no login profile, and panels
          # keep several Node versions side by side in several places (aaPanel's
          # own directory, its bundled nvm, a user nvm). Ask each candidate what
          # version it IS and take the highest — picking by directory order
          # silently installs against the wrong engine.
          best=""; best_major=0
          for d in ${DEPLOY_NODE_PATH:-} \
                   /www/server/nvm/versions/node/v*/bin \
                   /www/server/nodejs/v*/bin \
                   "${HOME:-/root}"/.nvm/versions/node/v*/bin \
                   "$(dirname "$(command -v node 2>/dev/null || echo /nonexistent/node)")"; do
            [ -x "$d/node" ] || continue
            m=$("$d/node" -p "process.versions.node.split('.')[0]" 2>/dev/null || echo 0)
            if [ "$m" -gt "$best_major" ]; then best_major="$m"; best="$d"; fi
          done
          # Still nothing new enough? Stop guessing at layouts and go find every
          # node on the box — panels move these between versions, and a deploy
          # should not break because a directory was renamed upstream.
          if [ "$best_major" -lt 22 ]; then
            for cand in $(find /www/server /opt /usr/local /home -maxdepth 6 -type f -name node -perm -u+x 2>/dev/null | head -40); do
              m=$("$cand" -p "process.versions.node.split('.')[0]" 2>/dev/null || echo 0)
              if [ "$m" -gt "$best_major" ]; then best_major="$m"; best=$(dirname "$cand"); fi
            done
          fi
          [ -n "$best" ] && PATH="$best:$PATH"
          export PATH
          for bin in node npm pm2 mysqldump git; do
            command -v "$bin" >/dev/null || { echo "ERROR: '$bin' not found in PATH ($PATH)"; exit 1; }
          done
          # PM2 keeps ONE daemon PER USER. Panels run app processes as `www`
          # while an SSH root session talks to root's daemon — which is why a
          # perfectly healthy app can be invisible to `pm2 list`. Look in every
          # plausible account before concluding anything.
          PM2_CANDIDATES="${DEPLOY_PM2_USER:-} $(id -un) www"
          pm2_as() {
            u="$1"; shift
            if [ "$u" = "$(id -un)" ]; then
              pm2 "$@"
            else
              sudo -n -u "$u" -H env PATH="$PATH" pm2 "$@"
            fi
          }
          # Prints the process name whose script lives under $APP_DIR, if any.
          pm2_match() {
            node -e '
              let s = "";
              process.stdin.on("data", (d) => (s += d)).on("end", () => {
                let list = [];
                try { list = JSON.parse(s); } catch {}
                // Trailing slash matters: /www/wwwroot/alliswell must not also
                // match a process living in /www/wwwroot/alliswell.space.
                const dir = process.argv[1].replace(/\/+$/, "") + "/";
                const hit = list.find((p) => (p.pm2_env?.pm_exec_path || "").startsWith(dir));
                process.stdout.write(hit ? String(hit.name) : "");
              });' "$APP_DIR"
          }

          echo "── environment ──"
          echo "  ssh user: $(id -un) · node $(node -v) ($(command -v node)) · npm $(npm -v)"
          for u in $PM2_CANDIDATES; do
            summary=$(pm2_as "$u" jlist 2>/dev/null | node -e '
              let s = "";
              process.stdin.on("data", (d) => (s += d)).on("end", () => {
                try { console.log(JSON.parse(s).map((p) => p.name).join(", ") || "(empty)"); }
                catch { console.log("(no daemon)"); }
              });' 2>/dev/null || echo "(unreachable)")
            echo "  pm2[$u]: $summary"
          done

          PM2_USER=""; TARGET=""
          for u in $PM2_CANDIDATES; do
            [ -n "$u" ] || continue
            json=$(pm2_as "$u" jlist 2>/dev/null || true)
            [ -n "$json" ] || continue
            if [ -n "${PM2_APP:-}" ] && printf '%s' "$json" | grep -q "\"name\":\"$PM2_APP\""; then
              PM2_USER="$u"; TARGET="$PM2_APP"; break
            fi
            name=$(printf '%s' "$json" | pm2_match)
            if [ -n "$name" ]; then PM2_USER="$u"; TARGET="$name"; break; fi
          done
          if [ -z "$TARGET" ]; then
            echo "ERROR: no PM2 process (under any of: $PM2_CANDIDATES) runs $APP_DIR." >&2
            echo "Set DEPLOY_PM2_APP and/or DEPLOY_PM2_USER, or check the list above." >&2
            exit 1
          fi
          echo "pm2 target: $TARGET (user: $PM2_USER)"

          # Engine check LAST, so the report above is always printed.
          #
          # package.json declares node >=22 and CI tests on 24, but a host that
          # is demonstrably serving traffic on an older runtime should not be
          # blocked from deploying by its own pipeline. So: HARD-fail only below
          # DEPLOY_MIN_NODE (18 — the oldest this app is known to run on), and
          # warn, every single deploy, whenever the runtime is behind what the
          # project actually tests. Raise DEPLOY_MIN_NODE to 22 to make it a
          # gate again once the host is upgraded.
          MIN_NODE="${DEPLOY_MIN_NODE:-18}"
          major=$(node -p "process.versions.node.split('.')[0]")
          if [ "$major" -lt "$MIN_NODE" ]; then
            echo "ERROR: node $(node -v) is below the accepted minimum (v$MIN_NODE)." >&2
            echo "--- every node binary on this host ---" >&2
            find /www/server /opt /usr/local /home -maxdepth 6 -type f -name node -perm -u+x 2>/dev/null \
              | while read -r n; do echo "  $n → $("$n" -v 2>/dev/null)" >&2; done
            echo "Install a newer Node (aaPanel ▸ App Store ▸ Node.js), or point the" >&2
            echo "DEPLOY_NODE_PATH repository variable at a bin directory that has one." >&2
            exit 1
          elif [ "$major" -lt 22 ]; then
            echo "::warning::Deploying under node $(node -v); package.json declares >=22 and CI tests on 24. It works today, but nothing verifies this runtime — upgrading the host removes a whole class of surprise."
          fi

          # Read DB credentials from the app's own .env (never duplicated into
          # CI secrets, so they cannot drift apart). Values are read line-wise
          # rather than sourced: a `.env` is data, not a shell script.
          env_get() { grep -E "^$1=" apps/api/.env | head -1 | cut -d= -f2-; }
          DB_HOST=$(env_get DATABASE_HOST); DB_PORT=$(env_get DATABASE_PORT)
          DB_USER=$(env_get DATABASE_USER); DB_PASS=$(env_get DATABASE_PASSWORD)
          DB_NAME=$(env_get DATABASE_NAME)

          # 1. Backup FIRST — migrations are forward-only; this is the undo.
          BACKUP_DIR=/www/backup/alliswell
          mkdir -p "$BACKUP_DIR"
          stamp=$(date +%Y%m%d-%H%M%S)
          MYSQL_PWD="$DB_PASS" mysqldump -h"$DB_HOST" -P"$DB_PORT" -u"$DB_USER" \
            --single-transaction --routines --triggers "$DB_NAME" \
            | gzip > "$BACKUP_DIR/db-$stamp-pre-$TAG.sql.gz"
          echo "backup: $BACKUP_DIR/db-$stamp-pre-$TAG.sql.gz ($(du -h "$BACKUP_DIR/db-$stamp-pre-$TAG.sql.gz" | cut -f1))"
          # Keep the 10 most recent backups.
          ls -1t "$BACKUP_DIR"/db-*.sql.gz 2>/dev/null | tail -n +11 | xargs -r rm --

          # 2. Check out the EXACT released tag (detached HEAD on purpose — the
          #    server runs a release, not "whatever main happens to be").
          git fetch --tags --force --prune origin
          git checkout -f "$TAG"
          echo "checked out: $(git describe --tags --always)"

          # 3. Dependencies + schema. knex/mysql2 are prod deps, so --omit=dev
          #    still migrates. Migrations are append-only: data is preserved.
          npm ci --omit=dev
          npm run db:migrate

          # 4. Restart the API with the (unchanged) .env re-read, as whichever
          #    account actually owns the process.
          pm2_as "$PM2_USER" restart "$TARGET" --update-env
          pm2_as "$PM2_USER" save || true
          REMOTE

      # Only now may the browser get the new bundle — the API it talks to is
      # already migrated and restarted.
      #
      # Deliberately NOT rsync: any remote login that prints something (an MOTD,
      # a login-alert script) corrupts rsync's protocol stream — the infamous
      # "protocol version mismatch -- is your shell clean?". A tar stream only
      # uses the remote's STDIN, so a chatty login is harmless. The swap is
      # directory-level, which also prunes the previous build's hashed assets
      # without needing --delete.
      - name: Publish the web bundle
        run: |
          tar -C apps/app/build/web -czf - . \
            | ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" \
                "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}" \
                "rm -rf '$WEB_DIR.incoming' && mkdir -p '$WEB_DIR.incoming' && tar -xzf - -C '$WEB_DIR.incoming'"

          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" \
            "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}" \
            "WEB_DIR='$WEB_DIR' bash -euo pipefail" <<'REMOTE'
          # Docroot files the SERVER owns, not the build: SPA routing, and the
          # .user.ini panels drop in every site root. Carry them across.
          for keep in .htaccess .user.ini; do
            [ -e "$WEB_DIR/$keep" ] && cp -a "$WEB_DIR/$keep" "$WEB_DIR.incoming/" 2>/dev/null || true
          done
          # Inherit the live docroot's ownership so the web server keeps reading it.
          chown -R --reference="$WEB_DIR" "$WEB_DIR.incoming" 2>/dev/null || true

          # Best-effort cleanup helper: aaPanel marks .user.ini immutable
          # (chattr +i), which even root cannot unlink until the flag is off.
          drop_dir() {
            [ -e "$1" ] || return 0
            chattr -R -i "$1" 2>/dev/null || true
            rm -rf "$1" 2>/dev/null || true
          }

          drop_dir "$WEB_DIR.previous"
          mv "$WEB_DIR" "$WEB_DIR.previous"
          if ! mv "$WEB_DIR.incoming" "$WEB_DIR"; then
            mv "$WEB_DIR.previous" "$WEB_DIR"   # never leave the site without a docroot
            echo "ERROR: could not swap in the new bundle — restored the previous one." >&2
            exit 1
          fi
          # From here the new bundle is LIVE. Tidying the old copy must never
          # fail the deploy — leftovers cost disk, a false red costs trust.
          drop_dir "$WEB_DIR.previous"
          echo "web bundle published to $WEB_DIR ($(find "$WEB_DIR" -type f | wc -l) files)"
          REMOTE

      # A deploy that "succeeded" while the API is down is the failure mode this
      # whole pipeline exists to prevent.
      - name: Verify the deployment is healthy
        run: |
          for attempt in $(seq 1 20); do
            body=$(curl -fsS --max-time 10 "$API_URL/health/ready" || true)
            echo "attempt $attempt: $body"
            case "$body" in
              *'"status":"ok"'*) echo "healthy"; exit 0 ;;
            esac
            sleep 5
          done
          echo "::error::/health/ready never reported ok — the API is degraded or down."
          echo "Investigate on the server: pm2 logs --lines 50"
          echo "The pre-deploy database backup is in /www/backup/alliswell/."
          exit 1
