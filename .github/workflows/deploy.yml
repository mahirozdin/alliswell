name: Deploy

# Ship a released tag to the maintainer's own instance.
#
# Called by release.yml after a tag's tests, release and images are green, and
# runnable by hand (Actions ▸ Deploy ▸ Run workflow) to redeploy an existing tag
# without minting a version — the same path, so a manual redeploy is never a
# different, less-tested procedure.
on:
  workflow_call:
    inputs:
      ref:
        description: The tag to deploy.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Tag to deploy, e.g. v0.4.0
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false # never interrupt a half-applied deploy

jobs:
  deploy:
    name: Deploy to production
    # Configured only on the upstream repo, so forks and clones can run
    # everything else without ever touching someone's server.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      APP_DIR: ${{ vars.DEPLOY_APP_DIR || '/www/wwwroot/alliswell' }}
      WEB_DIR: ${{ vars.DEPLOY_WEB_DIR || '/www/wwwroot/alliswell.space' }}
      PM2_APP: ${{ vars.DEPLOY_PM2_APP }}
      SSH_PORT: ${{ vars.DEPLOY_SSH_PORT || '22' }}
      API_URL: ${{ vars.DEPLOY_API_URL }}
      DEPLOY_REF: ${{ inputs.ref }}
      # Optional private overlay (the extension seam of src/lib/ee.js, deployed).
      # Empty repo slug = this instance runs the plain build and every overlay
      # stage below is skipped, byte for byte as before these steps existed.
      # The canonical public URL of THIS repository. Sent so the server's
      # `origin` can be normalised to it before fetching — see below.
      CORE_URL: https://github.com/${{ github.repository }}.git
      OVERLAY_REPO: ${{ secrets.DEPLOY_OVERLAY_REPO }}
      OVERLAY_REF: ${{ vars.DEPLOY_OVERLAY_REF || 'main' }}
      WILDCARD_ALIAS: ${{ vars.DEPLOY_WILDCARD_ALIAS }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The API base URL is compiled INTO the bundle, so production needs its
      # own build — the release artifact is the generic one.
      #
      # `--base-href /app/` is what makes the split docroot work: the marketing
      # site owns `/`, the app owns `/app`. Without it every asset path in the
      # bundle is absolute-from-root and the app 404s under a subdirectory.
      - name: Build the web bundle for production
        working-directory: apps/app
        run: |
          test -n "$API_URL" || { echo "::error::vars.DEPLOY_API_URL is not set"; exit 1; }
          flutter pub get
          flutter build web --release \
            --base-href /app/ \
            --dart-define=ALLISWELL_API_URL="$API_URL"

      # The marketing site is the docroot. It is assembled AFTER the app so the
      # combined tree below is written once, in one order, with one owner.
      - name: Build the landing site
        run: |
          npm ci
          npm run landing:build

      - name: Assemble the docroot (landing at /, the app at /app)
        run: |
          rm -rf publish && mkdir -p publish
          cp -a apps/landing/dist/. publish/
          mkdir -p publish/app
          cp -a apps/app/build/web/. publish/app/
          test -f publish/index.html     || { echo "::error::landing index.html missing"; exit 1; }
          test -f publish/app/index.html || { echo "::error::app index.html missing"; exit 1; }
          test -f publish/.htaccess      || { echo "::error::.htaccess missing — SPA routing would break"; exit 1; }
          # Flutter writes `<base href="/app/" />` — self-closing, with a
          # space. Match the attribute, not a hand-guessed tag spelling.
          grep -q 'base href="/app/"' publish/app/index.html \
            || { echo "::error::the app bundle was not built with --base-href /app/"; exit 1; }
          echo "docroot: $(find publish -type f | wc -l) files, $(du -sh publish | cut -f1)"

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$SSH_PORT" -H "${{ secrets.DEPLOY_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # Values that travel to the server as one-line shell arguments. Anything
      # multi-line (a data file, a block of KEY=VALUE lines) or containing a
      # quote would break the `VAR='...' bash` form the remote steps use, so it
      # is base64'd here and decoded there.
      #
      # GitHub masks a secret's LITERAL text in logs; it does not know that a
      # base64 of that secret is the same secret. So each encoding is registered
      # as a mask of its own — otherwise the first `set -x` or accidental echo
      # publishes a credential in a public log.
      - name: Prepare the overlay payload
        if: env.OVERLAY_REPO != ''
        env:
          OVERLAY_TOKEN: ${{ secrets.DEPLOY_OVERLAY_TOKEN }}
          OVERLAY_LICENSE: ${{ secrets.DEPLOY_OVERLAY_LICENSE }}
          OVERLAY_ENV: ${{ vars.DEPLOY_OVERLAY_ENV }}
          OVERLAY_ENV_SECRET: ${{ secrets.DEPLOY_OVERLAY_ENV_SECRET }}
        run: |
          test -n "$OVERLAY_TOKEN" || { echo "::error::secrets.DEPLOY_OVERLAY_TOKEN is not set — the private overlay cannot be fetched"; exit 1; }
          emit() { # $1 = output name, $2 = value ('' → empty output, no mask)
            if [ -z "$2" ]; then echo "$1=" >> "$GITHUB_ENV"; return; fi
            b64=$(printf '%s' "$2" | base64 | tr -d '\n')
            echo "::add-mask::$b64"
            echo "$1=$b64" >> "$GITHUB_ENV"
          }
          emit OVERLAY_TOKEN_B64   "$OVERLAY_TOKEN"
          emit OVERLAY_LICENSE_B64 "$OVERLAY_LICENSE"
          # Public (vars) and secret (secrets) env lines are merged, secrets
          # LAST so a secret always wins over a same-named plain value.
          merged=$(printf '%s\n%s\n' "$OVERLAY_ENV" "$OVERLAY_ENV_SECRET")
          # Two empty inputs still make two newlines. Encoding that would send
          # the server a payload whose only effect is a pointless .env backup.
          case "$merged" in *=*) : ;; *) merged="" ;; esac
          emit OVERLAY_ENV_B64 "$merged"
          echo "overlay: $OVERLAY_REPO@$OVERLAY_REF"
          [ -n "$OVERLAY_LICENSE" ] || echo "::warning::secrets.DEPLOY_OVERLAY_LICENSE is empty — the overlay will load, but without entitlements it behaves like the plain build"

      # Everything that touches the server runs as ONE script, so a failure
      # anywhere (set -e) stops before the next stage.
      - name: Back up the database, migrate and restart the API
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" \
            "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}" \
            "APP_DIR='$APP_DIR' PM2_APP='$PM2_APP' TAG='$DEPLOY_REF' CORE_URL='$CORE_URL' DEPLOY_NODE_PATH='${{ vars.DEPLOY_NODE_PATH }}' OVERLAY_REPO='$OVERLAY_REPO' OVERLAY_REF='$OVERLAY_REF' OVERLAY_TOKEN_B64='$OVERLAY_TOKEN_B64' OVERLAY_LICENSE_B64='$OVERLAY_LICENSE_B64' OVERLAY_ENV_B64='$OVERLAY_ENV_B64' bash -euo pipefail" <<'REMOTE'
          cd "$APP_DIR"

          # A non-interactive SSH session sources no login profile, and panels
          # keep several Node versions side by side in several places (aaPanel's
          # own directory, its bundled nvm, a user nvm). Ask each candidate what
          # version it IS and take the highest — picking by directory order
          # silently installs against the wrong engine.
          # A GitHub self-hosted runner ships its OWN private Node under
          # /opt/actions-runner/externals/. It is not an installed runtime: it
          # exists to run the runner, it is replaced without notice, and the
          # PM2 process this deploy restarts does not use it. Building native
          # modules against it is wrong even when it works — and on
          # 2026-08-12 it stopped working, because the runner moved from
          # node20 to node24 and argon2 0.44.0 has no prebuilt for that ABI, so
          # `npm ci` tried to compile and failed. It had been picking the
          # runner's node for months; the upstream bump only made it visible.
          is_runner_node() { case "$1" in */actions-runner/*) return 0 ;; *) return 1 ;; esac; }

          best=""; best_major=0
          for d in ${DEPLOY_NODE_PATH:-} \
                   /www/server/nvm/versions/node/v*/bin \
                   /www/server/nodejs/v*/bin \
                   "${HOME:-/root}"/.nvm/versions/node/v*/bin \
                   "$(dirname "$(command -v node 2>/dev/null || echo /nonexistent/node)")"; do
            [ -x "$d/node" ] || continue
            is_runner_node "$d" && continue
            m=$("$d/node" -p "process.versions.node.split('.')[0]" 2>/dev/null || echo 0)
            if [ "$m" -gt "$best_major" ]; then best_major="$m"; best="$d"; fi
          done
          # Still nothing new enough? Stop guessing at layouts and go find every
          # node on the box — panels move these between versions, and a deploy
          # should not break because a directory was renamed upstream.
          if [ "$best_major" -lt 22 ]; then
            for cand in $(find /www/server /opt /usr/local /home -maxdepth 6 -type f -name node -perm -u+x 2>/dev/null | head -40); do
              is_runner_node "$cand" && continue
              m=$("$cand" -p "process.versions.node.split('.')[0]" 2>/dev/null || echo 0)
              if [ "$m" -gt "$best_major" ]; then best_major="$m"; best=$(dirname "$cand"); fi
            done
          fi
          [ -n "$best" ] && PATH="$best:$PATH"
          export PATH
          for bin in node npm pm2 mysqldump git; do
            command -v "$bin" >/dev/null || { echo "ERROR: '$bin' not found in PATH ($PATH)"; exit 1; }
          done
          # PM2 keeps ONE daemon PER USER. Panels run app processes as `www`
          # while an SSH root session talks to root's daemon — which is why a
          # perfectly healthy app can be invisible to `pm2 list`. Look in every
          # plausible account before concluding anything.
          PM2_CANDIDATES="${DEPLOY_PM2_USER:-} $(id -un) www"
          pm2_as() {
            u="$1"; shift
            if [ "$u" = "$(id -un)" ]; then
              pm2 "$@"
            else
              sudo -n -u "$u" -H env PATH="$PATH" pm2 "$@"
            fi
          }
          # Prints the process name whose script lives under $APP_DIR, if any.
          pm2_match() {
            node -e '
              let s = "";
              process.stdin.on("data", (d) => (s += d)).on("end", () => {
                let list = [];
                try { list = JSON.parse(s); } catch {}
                // Trailing slash matters: /www/wwwroot/alliswell must not also
                // match a process living in /www/wwwroot/alliswell.space.
                const dir = process.argv[1].replace(/\/+$/, "") + "/";
                const hit = list.find((p) => (p.pm2_env?.pm_exec_path || "").startsWith(dir));
                process.stdout.write(hit ? String(hit.name) : "");
              });' "$APP_DIR"
          }

          echo "── environment ──"
          echo "  ssh user: $(id -un) · node $(node -v) ($(command -v node)) · npm $(npm -v)"
          for u in $PM2_CANDIDATES; do
            summary=$(pm2_as "$u" jlist 2>/dev/null | node -e '
              let s = "";
              process.stdin.on("data", (d) => (s += d)).on("end", () => {
                try { console.log(JSON.parse(s).map((p) => p.name).join(", ") || "(empty)"); }
                catch { console.log("(no daemon)"); }
              });' 2>/dev/null || echo "(unreachable)")
            echo "  pm2[$u]: $summary"
          done

          PM2_USER=""; TARGET=""
          for u in $PM2_CANDIDATES; do
            [ -n "$u" ] || continue
            json=$(pm2_as "$u" jlist 2>/dev/null || true)
            [ -n "$json" ] || continue
            if [ -n "${PM2_APP:-}" ] && printf '%s' "$json" | grep -q "\"name\":\"$PM2_APP\""; then
              PM2_USER="$u"; TARGET="$PM2_APP"; break
            fi
            name=$(printf '%s' "$json" | pm2_match)
            if [ -n "$name" ]; then PM2_USER="$u"; TARGET="$name"; break; fi
          done
          if [ -z "$TARGET" ]; then
            echo "ERROR: no PM2 process (under any of: $PM2_CANDIDATES) runs $APP_DIR." >&2
            echo "Set DEPLOY_PM2_APP and/or DEPLOY_PM2_USER, or check the list above." >&2
            exit 1
          fi
          echo "pm2 target: $TARGET (user: $PM2_USER)"

          # Engine check LAST, so the report above is always printed.
          #
          # package.json declares node >=22 and CI tests on 24, but a host that
          # is demonstrably serving traffic on an older runtime should not be
          # blocked from deploying by its own pipeline. So: HARD-fail only below
          # DEPLOY_MIN_NODE (18 — the oldest this app is known to run on), and
          # warn, every single deploy, whenever the runtime is behind what the
          # project actually tests. Raise DEPLOY_MIN_NODE to 22 to make it a
          # gate again once the host is upgraded.
          MIN_NODE="${DEPLOY_MIN_NODE:-18}"
          major=$(node -p "process.versions.node.split('.')[0]")
          if [ "$major" -lt "$MIN_NODE" ]; then
            echo "ERROR: node $(node -v) is below the accepted minimum (v$MIN_NODE)." >&2
            echo "--- every node binary on this host ---" >&2
            find /www/server /opt /usr/local /home -maxdepth 6 -type f -name node -perm -u+x 2>/dev/null \
              | grep -v '/actions-runner/' \
              | while read -r n; do echo "  $n → $("$n" -v 2>/dev/null)" >&2; done
            echo "Install a newer Node (aaPanel ▸ App Store ▸ Node.js), or point the" >&2
            echo "DEPLOY_NODE_PATH repository variable at a bin directory that has one." >&2
            exit 1
          elif [ "$major" -lt 22 ]; then
            echo "::warning::Deploying under node $(node -v); package.json declares >=22 and CI tests on 24. It works today, but nothing verifies this runtime — upgrading the host removes a whole class of surprise."
          fi

          # Read DB credentials from the app's own .env (never duplicated into
          # CI secrets, so they cannot drift apart). Values are read line-wise
          # rather than sourced: a `.env` is data, not a shell script.
          env_get() { grep -E "^$1=" apps/api/.env | head -1 | cut -d= -f2-; }
          DB_HOST=$(env_get DATABASE_HOST); DB_PORT=$(env_get DATABASE_PORT)
          DB_USER=$(env_get DATABASE_USER); DB_PASS=$(env_get DATABASE_PASSWORD)
          DB_NAME=$(env_get DATABASE_NAME)

          # 1. Backup FIRST — migrations are forward-only; this is the undo.
          BACKUP_DIR=/www/backup/alliswell
          mkdir -p "$BACKUP_DIR"
          stamp=$(date +%Y%m%d-%H%M%S)
          MYSQL_PWD="$DB_PASS" mysqldump -h"$DB_HOST" -P"$DB_PORT" -u"$DB_USER" \
            --single-transaction --routines --triggers "$DB_NAME" \
            | gzip > "$BACKUP_DIR/db-$stamp-pre-$TAG.sql.gz"
          echo "backup: $BACKUP_DIR/db-$stamp-pre-$TAG.sql.gz ($(du -h "$BACKUP_DIR/db-$stamp-pre-$TAG.sql.gz" | cut -f1))"
          # Keep the 10 most recent backups.
          ls -1t "$BACKUP_DIR"/db-*.sql.gz 2>/dev/null | tail -n +11 | xargs -r rm --

          # 2. Check out the EXACT released tag (detached HEAD on purpose — the
          #    server runs a release, not "whatever main happens to be").
          # `origin` is normalised to the canonical PUBLIC url first, and that
          # is not tidiness. A credential embedded in that url — from a clone
          # somebody did by hand once — keeps working until it expires, and
          # then GitHub answers 401 and git asks for a username a
          # non-interactive shell can never give it. The deploy dies with
          # "could not read Username", which reads as a network or permissions
          # problem and is neither. Measured 2026-09-02, on the first deploy in
          # five weeks, after the backup and before anything was published.
          #
          # This repository is public, so the fetch needs no credential at all
          # — and the overlay's clone below already keeps its own origin clean
          # for a neighbouring reason.
          case "$(git remote get-url origin)" in
            *@github.com*) echo "origin carried an embedded credential - replaced with the public url" ;;
            *) : ;;
          esac
          git remote set-url origin "$CORE_URL"
          git fetch --tags --force --prune origin
          git checkout -f "$TAG"
          echo "checked out: $(git describe --tags --always)"

          # 2b. The optional private overlay, BEFORE dependencies and schema.
          #     This ordering is not a preference, it is the contract:
          #     resolveEeDir() feeds the knexfile as well as the runtime loader
          #     (src/lib/ee.js), so `db:migrate` only sees the overlay's
          #     migrations when the checkout is already on disk. Sync it after
          #     `git checkout` and the migration runs once, over both sets.
          #
          #     `/ee/` is gitignored by this repo, so the checkout above never
          #     disturbs it — that ignore rule is an operational guarantee, not
          #     only a policy one.
          OVERLAY_DIR="$APP_DIR/ee"
          if [ -n "${OVERLAY_REPO:-}" ]; then
            TOKEN=$(printf '%s' "${OVERLAY_TOKEN_B64:-}" | base64 -d)
            # The token lives in the fetch URL for the length of one command and
            # is never written to .git/config: `origin` keeps the clean URL, so
            # a credential cannot be read back off the server later.
            AUTH_URL="https://x-access-token:$TOKEN@github.com/$OVERLAY_REPO.git"
            CLEAN_URL="https://github.com/$OVERLAY_REPO.git"
            if [ ! -d "$OVERLAY_DIR/.git" ]; then
              rm -rf "$OVERLAY_DIR"
              git clone --quiet "$AUTH_URL" "$OVERLAY_DIR"
              git -C "$OVERLAY_DIR" remote set-url origin "$CLEAN_URL"
            fi
            git -C "$OVERLAY_DIR" fetch --quiet --tags --force --prune "$AUTH_URL" \
              "+refs/heads/*:refs/remotes/origin/*"
            unset TOKEN AUTH_URL
            # A ref may be a tag or a branch. Resolve it once, then move to the
            # exact commit — `checkout <branch>` would leave the tree tracking a
            # branch whose next commit lands unannounced on the next restart.
            if ! SHA=$(git -C "$OVERLAY_DIR" rev-parse --verify --quiet "refs/tags/$OVERLAY_REF^{commit}"); then
              SHA=$(git -C "$OVERLAY_DIR" rev-parse --verify --quiet "refs/remotes/origin/$OVERLAY_REF^{commit}") || {
                echo "ERROR: overlay ref '$OVERLAY_REF' is neither a tag nor a branch on $OVERLAY_REPO." >&2
                exit 1
              }
            fi
            git -C "$OVERLAY_DIR" checkout -f --quiet "$SHA"
            echo "overlay: $OVERLAY_REPO@$OVERLAY_REF → $(git -C "$OVERLAY_DIR" describe --tags --always)"
            case "$OVERLAY_REF" in
              v*|ee-v*) : ;;
              *) echo "::warning::the overlay is deployed from '$OVERLAY_REF', not a tag — this instance runs a moving target while the core half runs a release" ;;
            esac
            # An explicit `if`, not `[ -f … ] && …`: under `set -e` an AND-list
            # whose test fails is survivable in the middle of a script and FATAL
            # as its last command (measured). Nothing here is last today, and
            # nothing should have to stay last for this to keep working.
            if [ -f "$OVERLAY_DIR/package-lock.json" ]; then
              ( cd "$OVERLAY_DIR" && npm ci --omit=dev --silent )
            fi
            # The signed data file the overlay reads at boot. Written whole and
            # moved into place so a half-written file can never be read, and
            # kept 0600 because it is a delivered commercial artifact.
            if [ -n "${OVERLAY_LICENSE_B64:-}" ]; then
              printf '%s' "$OVERLAY_LICENSE_B64" | base64 -d > "$OVERLAY_DIR/.license.incoming"
              chmod 600 "$OVERLAY_DIR/.license.incoming"
              node -e 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"))' "$OVERLAY_DIR/.license.incoming" \
                || { echo "ERROR: the supplied licence is not valid JSON — leaving the existing one alone." >&2; rm -f "$OVERLAY_DIR/.license.incoming"; exit 1; }
              mv "$OVERLAY_DIR/.license.incoming" "$OVERLAY_DIR/license.json"
              echo "licence file: $(wc -c < "$OVERLAY_DIR/license.json") bytes"
            fi
          elif [ -d "$OVERLAY_DIR" ]; then
            # Nothing is removed: an overlay put there by hand keeps working.
            # Say so, because a silently un-managed directory is the kind of
            # thing a deploy log should never leave to inference.
            echo "::warning::$OVERLAY_DIR exists but no overlay repo is configured — it is NOT managed by this deploy"
          fi

          # 2c. Deploy-managed .env keys. The application's .env stays the one
          #     source of truth for credentials; this only reconciles the keys
          #     the deploy owns, so a server never has to be edited by hand to
          #     change a hostname. Values are never printed — only key names.
          ENV_FILE="$APP_DIR/apps/api/.env"
          if [ -n "${OVERLAY_ENV_B64:-}" ]; then
            printf '%s' "$OVERLAY_ENV_B64" | base64 -d > /tmp/aw-env-lines.$$
            touched=""
            cp -a "$ENV_FILE" "$ENV_FILE.pre-$TAG"
            while IFS= read -r line; do
              case "$line" in ''|'#'*) continue ;; esac
              key=${line%%=*}
              # A malformed line must not become a key named after half a
              # sentence: only a real shell-style identifier is accepted.
              case "$key" in
                *[!A-Za-z0-9_]*|'') echo "::warning::ignoring a malformed deploy-managed env line"; continue ;;
              esac
              if grep -qE "^$key=" "$ENV_FILE"; then
                # Rewrite in place, value-blind: the replacement is passed as an
                # argument, never interpolated into a sed expression, so a value
                # containing / or & cannot corrupt the file.
                node -e '
                  const fs = require("fs");
                  const [file, key, value] = process.argv.slice(1);
                  const out = fs.readFileSync(file, "utf8").split("\n")
                    .map((l) => (l.startsWith(key + "=") ? key + "=" + value : l))
                    .join("\n");
                  fs.writeFileSync(file, out);
                ' "$ENV_FILE" "$key" "${line#*=}"
              else
                printf '%s\n' "$line" >> "$ENV_FILE"
              fi
              touched="$touched $key"
            done < /tmp/aw-env-lines.$$
            rm -f /tmp/aw-env-lines.$$
            echo "env keys reconciled:${touched:- (none)}  (backup: $ENV_FILE.pre-$TAG)"
            ls -1t "$APP_DIR/apps/api/.env.pre-"* 2>/dev/null | tail -n +6 | xargs -r rm --
          fi

          # 3. Dependencies + schema. knex/mysql2 are prod deps, so --omit=dev
          #    still migrates. Migrations are append-only: data is preserved.
          npm ci --omit=dev
          npm run db:migrate

          # 4. Restart the API with the (unchanged) .env re-read, as whichever
          #    account actually owns the process.
          pm2_as "$PM2_USER" restart "$TARGET" --update-env
          pm2_as "$PM2_USER" save || true
          REMOTE

      # aaPanel's vhost carries a blanket `SetOutputFilter DEFLATE`, which
      # buffers the AI chat's tiny text/event-stream frames until zlib has a
      # full block; the edge (Cloudflare) sees silence, times the request out
      # at ~100 s and the app reads "connection failed" — found live 2026-08-04.
      # This applies the AI.md §3 prod checklist idempotently on every deploy:
      # a deploy-managed conf in the vhost's IncludeOptional'd proxy dir, only
      # ever swapped in after `apachectl -t` blesses it.
      - name: Ensure Apache does not buffer the AI SSE stream
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" \
            "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}" \
            "bash -euo pipefail" <<'REMOTE'
          PROXY_DIR=/www/server/panel/vhost/apache/proxy/api.alliswell.space
          if [ ! -d "$PROXY_DIR" ]; then
            echo "no aaPanel apache proxy dir — nothing to do on this host"
            exit 0
          fi
          CONF="$PROXY_DIR/zz-alliswell-sse.conf"
          WANT=$(mktemp)
          {
            echo '# AllisWell (deploy-managed — edits here are overwritten).'
            echo '# The AI chat streams text/event-stream; the vhost-wide DEFLATE'
            echo '# filter must not buffer it or the edge times the stream out.'
            echo '# AI.md §3 prod checklist.'
            echo '<LocationMatch "/ai/chat">'
            echo '  SetEnv no-gzip 1'
            echo '  SetEnv no-brotli 1'
            echo '</LocationMatch>'
          } > "$WANT"
          if [ -f "$CONF" ] && cmp -s "$WANT" "$CONF"; then
            echo "sse conf already in place"
            rm -f "$WANT"
            exit 0
          fi
          PREV=$(mktemp); had_conf=0
          [ -f "$CONF" ] && { cp "$CONF" "$PREV"; had_conf=1; }
          cp "$WANT" "$CONF"; rm -f "$WANT"
          APACHECTL=/www/server/apache/bin/apachectl
          if [ -x "$APACHECTL" ] && "$APACHECTL" -t; then
            "$APACHECTL" -k graceful || true
            echo "sse conf installed and apache gracefully reloaded"
          else
            # Never leave apache with a conf it rejects — restore what was there.
            if [ "$had_conf" = 1 ]; then cp "$PREV" "$CONF"; else rm -f "$CONF"; fi
            echo "::warning::apache config test failed — SSE conf NOT applied; AI chat will keep buffering"
          fi
          rm -f "$PREV"
          REMOTE

      # The API answers on one hostname today. An instance that derives request
      # context from the Host header needs every name under an apex to reach it,
      # which on Apache is one ServerAlias — and `ProxyPreserveHost On`, without
      # which every request arrives as the apex and host-derived context is
      # silently empty. That is the single most common misconfiguration of this
      # layout, so the conf asserts it rather than assuming the vhost has it.
      #
      # Same shape as the SSE conf above: deploy-managed, written into the
      # vhost's IncludeOptional'd directory, and only ever kept if apachectl
      # blesses the result.
      - name: Ensure the API answers on every host under the apex
        if: vars.DEPLOY_WILDCARD_ALIAS != ''
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" \
            "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}" \
            "WILDCARD_ALIAS='$WILDCARD_ALIAS' bash -euo pipefail" <<'REMOTE'
          PROXY_DIR=/www/server/panel/vhost/apache/proxy/api.alliswell.space
          if [ ! -d "$PROXY_DIR" ]; then
            echo "::warning::no aaPanel apache proxy dir — add the ServerAlias by hand (SELF-HOSTING §3)"
            exit 0
          fi
          CONF="$PROXY_DIR/zz-alliswell-wildcard.conf"
          WANT=$(mktemp)
          {
            echo '# AllisWell (deploy-managed — edits here are overwritten).'
            echo '# Every name under the apex reaches this vhost, and reaches it'
            echo '# carrying its ORIGINAL Host: request context is derived from'
            echo '# that header and nothing else can reconstruct it downstream.'
            echo "ServerAlias $WILDCARD_ALIAS"
            echo 'ProxyPreserveHost On'
          } > "$WANT"
          if [ -f "$CONF" ] && cmp -s "$WANT" "$CONF"; then
            echo "wildcard alias already in place ($WILDCARD_ALIAS)"
            rm -f "$WANT"; exit 0
          fi
          PREV=$(mktemp); had_conf=0
          [ -f "$CONF" ] && { cp "$CONF" "$PREV"; had_conf=1; }
          cp "$WANT" "$CONF"; rm -f "$WANT"
          APACHECTL=/www/server/apache/bin/apachectl
          if [ -x "$APACHECTL" ] && "$APACHECTL" -t; then
            "$APACHECTL" -k graceful || true
            echo "wildcard alias installed ($WILDCARD_ALIAS) and apache gracefully reloaded"
          else
            # An IncludeOptional that lands OUTSIDE <VirtualHost> makes
            # ServerAlias a fatal directive. Never leave apache unable to start.
            if [ "$had_conf" = 1 ]; then cp "$PREV" "$CONF"; else rm -f "$CONF"; fi
            echo "::warning::apache rejected the config — wildcard alias NOT applied; add ServerAlias/ProxyPreserveHost to the vhost by hand"
          fi
          rm -f "$PREV"
          REMOTE

      # Only now may the browser get the new bundle — the API it talks to is
      # already migrated and restarted.
      #
      # Deliberately NOT rsync: any remote login that prints something (an MOTD,
      # a login-alert script) corrupts rsync's protocol stream — the infamous
      # "protocol version mismatch -- is your shell clean?". A tar stream only
      # uses the remote's STDIN, so a chatty login is harmless. The swap is
      # directory-level, which also prunes the previous build's hashed assets
      # without needing --delete.
      - name: Publish the web bundle
        run: |
          tar -C publish -czf - . \
            | ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" \
                "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}" \
                "rm -rf '$WEB_DIR.incoming' && mkdir -p '$WEB_DIR.incoming' && tar -xzf - -C '$WEB_DIR.incoming'"

          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" \
            "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}" \
            "WEB_DIR='$WEB_DIR' bash -euo pipefail" <<'REMOTE'
          # `.user.ini` is the panel's, not ours — carry it across. `.htaccess`
          # used to be carried too, back when the docroot was only the Flutter
          # bundle and the server owned its rewrite rules. It now ships WITH the
          # build (apps/landing/public/.htaccess), because the routing is a
          # property of what is deployed — two SPAs sharing one docroot — not of
          # the machine. Keeping the server's copy would silently strip /app.
          for keep in .user.ini; do
            [ -e "$WEB_DIR/$keep" ] && cp -a "$WEB_DIR/$keep" "$WEB_DIR.incoming/" 2>/dev/null || true
          done
          # Inherit the live docroot's ownership so the web server keeps reading it.
          chown -R --reference="$WEB_DIR" "$WEB_DIR.incoming" 2>/dev/null || true

          # Best-effort cleanup helper: aaPanel marks .user.ini immutable
          # (chattr +i), which even root cannot unlink until the flag is off.
          drop_dir() {
            [ -e "$1" ] || return 0
            chattr -R -i "$1" 2>/dev/null || true
            rm -rf "$1" 2>/dev/null || true
          }

          drop_dir "$WEB_DIR.previous"
          mv "$WEB_DIR" "$WEB_DIR.previous"
          if ! mv "$WEB_DIR.incoming" "$WEB_DIR"; then
            mv "$WEB_DIR.previous" "$WEB_DIR"   # never leave the site without a docroot
            echo "ERROR: could not swap in the new bundle — restored the previous one." >&2
            exit 1
          fi
          # From here the new bundle is LIVE. Tidying the old copy must never
          # fail the deploy — leftovers cost disk, a false red costs trust.
          drop_dir "$WEB_DIR.previous"
          echo "web bundle published to $WEB_DIR ($(find "$WEB_DIR" -type f | wc -l) files)"
          REMOTE

      # A deploy that "succeeded" while the API is down is the failure mode this
      # whole pipeline exists to prevent.
      - name: Verify the deployment is healthy
        run: |
          for attempt in $(seq 1 20); do
            body=$(curl -fsS --max-time 10 "$API_URL/health/ready" || true)
            echo "attempt $attempt: $body"
            case "$body" in
              *'"status":"ok"'*) echo "healthy"; exit 0 ;;
            esac
            sleep 5
          done
          echo "::error::/health/ready never reported ok — the API is degraded or down."
          echo "Investigate on the server: pm2 logs --lines 50"
          echo "The pre-deploy database backup is in /www/backup/alliswell/."
          exit 1

      # The API being up says nothing about the two SPAs sharing one docroot.
      # A deploy that serves the landing page at / and a 404 at /app is exactly
      # the failure this split introduces, so it gets its own check.
      - name: Verify both sites answer
        if: vars.DEPLOY_SITE_URL != ''
        run: |
          site="${{ vars.DEPLOY_SITE_URL }}"
          fail=0

          root=$(curl -fsS --max-time 15 "$site/" || true)
          case "$root" in
            *'AllisWell'*) echo "✓ landing page served at $site/" ;;
            *) echo "::error::$site/ did not return the landing page"; fail=1 ;;
          esac

          app=$(curl -fsS --max-time 15 "$site/app/" || true)
          case "$app" in
            *'base href="/app/"'*) echo "✓ app served at $site/app/" ;;
            *) echo "::error::$site/app/ did not return the Flutter bundle"; fail=1 ;;
          esac

          # A deep link is the one the rewrite rules actually have to get right.
          deep=$(curl -fsS --max-time 15 "$site/app/projects" || true)
          case "$deep" in
            *'base href="/app/"'*) echo "✓ deep links under /app rewrite correctly" ;;
            *) echo "::error::$site/app/projects did not rewrite to the app — check .htaccess"; fail=1 ;;
          esac

          # The legal pages are a store REQUIREMENT, and they are the pages most
          # likely to be broken by something between us and the visitor rather
          # than by the build — Cloudflare's Email Address Obfuscation silently
          # replaced the privacy policy's contact address with
          # "[email protected]" the first time this deployed. Assert what is
          # actually served, not what was built.
          for page in privacy support privacy/tr support/tr; do
            html=$(curl -fsSL --max-time 20 "$site/$page/" || true)
            case "$html" in
              *'info@bubiapps.com'*) echo "✓ /$page serves a readable contact address" ;;
              *'email-protection'*|*'[email'*)
                echo "::error::/$page has its contact address obfuscated — turn off Cloudflare Email Address Obfuscation for this zone, or check the <!--email_off--> wrapper"; fail=1 ;;
              *) echo "::error::/$page did not load, or has no contact address"; fail=1 ;;
            esac
          done

          exit $fail

      # DNS, certificate and proxy for the wildcard, proved on a name that has
      # never been configured anywhere. That is the point: a host nobody has
      # heard of must still resolve, present a valid certificate and reach the
      # API, because that is what a name created later will have to do.
      #
      # What this does NOT prove is Host preservation — /health/live answers the
      # same whatever host it arrives as. The proxy header half is checked by
      # the vhost conf above and by the instance's own acceptance run.
      - name: Verify the wildcard reaches the API
        if: vars.DEPLOY_WILDCARD_ALIAS != ''
        run: |
          apex="${WILDCARD_ALIAS#\*.}"
          fail=0
          # Two different labels: one pass could be a single-name certificate
          # that happens to match; two cannot.
          for label in deploy-probe never-registered-$(date +%s); do
            host="$label.$apex"
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "https://$host/health/live" 2>/tmp/curl.err || true)
            if [ "$code" = "200" ]; then
              echo "✓ https://$host/health/live → 200 (DNS, TLS and proxy all answer)"
            else
              echo "::error::https://$host/health/live → ${code:-no response}. $(cat /tmp/curl.err)"
              case "$code" in
                # 52x are the EDGE's own codes when a CDN fronts this instance,
                # and 526 is precise: the edge reached the origin and refused
                # the certificate it presented. No vhost or proxy change moves
                # it — the origin needs a certificate that covers *.$apex.
                526) echo "  526: the edge rejected the ORIGIN's certificate. It must cover *.$apex (an edge-issued origin cert, or certbot DNS-01), or the zone must leave strict origin validation." ;;
                521|522|523) echo "  $code: the edge could not reach the origin at all — firewall, or nothing listening." ;;
                000) echo "  No HTTP happened: DNS or the client-facing TLS handshake failed." ;;
                404|503) echo "  The request reached a vhost that is not the API — check the ServerAlias step above." ;;
                *) echo "  Expected 200." ;;
              esac
              fail=1
            fi
          done
          exit $fail
