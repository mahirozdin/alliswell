# AllisWell — self-hosting stack, running the PUBLISHED images.
#
#   curl -O https://raw.githubusercontent.com/mahirozdin/alliswell/main/docker-compose.selfhost.yml
#   curl -o .env https://raw.githubusercontent.com/mahirozdin/alliswell/main/.env.selfhost.example
#   # edit .env (secrets + your domains), then:
#   docker compose -f docker-compose.selfhost.yml up -d
#
# Upgrades keep your data: bump ALLISWELL_VERSION (or keep `latest`), then
# `docker compose -f docker-compose.selfhost.yml pull && … up -d`. The API
# container applies pending migrations itself on start — the named volumes below
# are what hold your database, so never delete them.
#
# Full guide, including TLS and Cloudflare R2 attachments: docs/SELF-HOSTING.md
name: alliswell

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DATABASE_NAME:-alliswell}
      MYSQL_USER: ${DATABASE_USER:-alliswell}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql # ← your data lives here
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent',
        ]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    image: ghcr.io/mahirozdin/alliswell-api:${ALLISWELL_VERSION:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_HOST: mysql
      DATABASE_PORT: "3306"
      DATABASE_USER: ${DATABASE_USER:-alliswell}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}
      DATABASE_NAME: ${DATABASE_NAME:-alliswell}
      REDIS_URL: redis://redis:6379
      # Two DIFFERENT random secrets — the API refuses to boot without them.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?openssl rand -hex 32}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?openssl rand -hex 32}
      # The origin the web app is served from — browsers enforce this.
      CORS_ORIGIN: ${CORS_ORIGIN:?e.g. https://alliswell.example}
      # A TLS terminator (Caddy/Nginx/Traefik/Cloudflare) sits in front, so the
      # real client IP arrives in X-Forwarded-For; without this every request
      # shares one rate-limit bucket.
      TRUST_PROXY: ${TRUST_PROXY:-true}
      # Optional — Google Calendar sync (docs/SELF-HOSTING.md §Google).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      CALENDAR_TOKEN_KEY: ${CALENDAR_TOKEN_KEY:-}
      GOOGLE_WEBHOOK_URL: ${GOOGLE_WEBHOOK_URL:-}
      # Optional — file attachments on Cloudflare R2 / any S3 (docs/ATTACHMENTS.md).
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-auto}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-}
      STORAGE_S3_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID:-}
      STORAGE_S3_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY:-}
      STORAGE_MAX_UPLOAD_MB: ${STORAGE_MAX_UPLOAD_MB:-10}
      STORAGE_PRESIGN_TTL_SEC: ${STORAGE_PRESIGN_TTL_SEC:-900}
    ports:
      # Loopback only: put your TLS proxy in front of it.
      - "${API_BIND:-127.0.0.1}:${API_PORT:-3000}:3000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: ghcr.io/mahirozdin/alliswell-web:${ALLISWELL_VERSION:-latest}
    restart: unless-stopped
    environment:
      # Injected into the bundle at container start — no rebuild needed.
      ALLISWELL_API_URL: ${ALLISWELL_API_URL:?e.g. https://api.alliswell.example}
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  mysql_data:
  redis_data:
