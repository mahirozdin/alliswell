server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Flutter/go_router owns the URL space: any path that is not a real file must
  # return the app shell, or a refresh on /projects 404s.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Rewritten on every container start — a cached copy would pin the browser to
  # a previous deployment's API address.
  location = /alliswell-config.js {
    add_header Cache-Control "no-store" always;
  }

  # index.html must be revalidated too, otherwise a browser keeps loading the
  # old build's asset hashes after an upgrade.
  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }

  location = /flutter_service_worker.js {
    add_header Cache-Control "no-cache" always;
  }

  # NOT content-hashed — and this used to claim otherwise.
  #
  # A Flutter web build writes `main.dart.js`, `flutter_bootstrap.js` and every
  # file under `assets/` with the SAME NAME every time; only the contents
  # change. Caching those "hard and forever" strands a returning visitor on the
  # previous app until the entry expires (measured on the hosted instance,
  # 2026-08-17: fresh index.html, fresh service worker, year-old app code).
  #
  # So: revalidate. ETags make an unchanged file a 304, which is the whole
  # cost. (`expires` is deliberately not used: it emits its own Cache-Control
  # and the response would carry the header twice.)
  location ~* \.(js|wasm|css|png|jpg|jpeg|gif|svg|woff2?|ttf|otf|json)$ {
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json
             application/wasm image/svg+xml;
  gzip_min_length 1024;
}
