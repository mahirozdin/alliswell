server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Flutter/go_router owns the URL space: any path that is not a real file must
  # return the app shell, or a refresh on /projects 404s.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Rewritten on every container start — a cached copy would pin the browser to
  # a previous deployment's API address.
  location = /alliswell-config.js {
    add_header Cache-Control "no-store" always;
  }

  # index.html must be revalidated too, otherwise a browser keeps loading the
  # old build's asset hashes after an upgrade.
  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }

  location = /flutter_service_worker.js {
    add_header Cache-Control "no-cache" always;
  }

  # Everything else is content-hashed by the Flutter build, so it can be cached
  # hard and forever.
  # (`expires` is deliberately not used here: it emits its own Cache-Control and
  # the response would carry the header twice.)
  location ~* \.(js|wasm|css|png|jpg|jpeg|gif|svg|woff2?|ttf|otf|json)$ {
    add_header Cache-Control "public, max-age=2592000, immutable" always;
  }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json
             application/wasm image/svg+xml;
  gzip_min_length 1024;
}
